pre-commit:
  parallel: false
  commands:
    secrets:
      run: gitleaks protect --staged
    formatting:
      run: pnpm run format:all:check
    typecheck-web:
      run: cd apps/web && pnpm exec tsc --noEmit
    dependency-audit:
      run: pnpm run check:deps
    knip:
      run: pnpm run check:knip
