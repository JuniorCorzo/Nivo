<section class="@container block w-full">
  <header
    class="bg-card border-border grid w-full grid-cols-[auto_1fr] gap-3.5 rounded-2xl border p-4 shadow-xs @sm:grid-cols-[auto_1fr_auto] @sm:grid-rows-[auto_auto] @sm:items-center @sm:gap-x-4 @sm:gap-y-2 @sm:p-6"
  >
    <!-- ========================================== -->
    <!-- MOBILE ROW 1: Back + Route Path + Badge     -->
    <!-- ========================================== -->
    <app-page-header-mobile-bar
      class="col-span-full row-start-1 @sm:hidden"
      [isRoot]="isRoot()"
      [mobilePath]="currentMobilePath()"
      [badge]="badge()"
      [badgeVariant]="badgeVariant()"
      (back)="goBack()"
    >
      <ng-content select="[badge]" ngProjectAs="[badge]" />
    </app-page-header-mobile-bar>

    <!-- ========================================== -->
    <!-- DESKTOP ROW 1: Breadcrumbs (full width top)-->
    <!-- ========================================== -->
    <div
      class="page-header-desktop hidden @sm:col-span-2 @sm:col-start-2 @sm:row-start-1 @sm:flex @sm:items-center @sm:gap-2"
    >
      @if (showHistoryButtons()) {
      <app-page-header-history (back)="goBack()" (forward)="goForward()" />
      <nv-divider orientation="vertical" class="max-h-4"></nv-divider>
      }
      <app-page-header-breadcrumbs [breadcrumbs]="computedBreadcrumbs()" />
    </div>

    <!-- ========================================== -->
    <!-- ICON: Left, self-center on Mobile, 2 rows on Desktop -->
    <!-- ========================================== -->
    @if (icon()) {
    <div
      class="bg-primary/10 text-primary border-primary/20 col-start-1 row-start-2 flex h-10 w-10 shrink-0 items-center justify-center self-center rounded-xl border @sm:col-start-1 @sm:row-span-2 @sm:row-start-1 @sm:h-11 @sm:w-11"
    >
      <ng-icon [name]="icon()!" size="20" class="shrink-0" />
    </div>
    } @else {
    <div
      class="col-start-1 row-start-2 self-center empty:hidden @sm:col-start-1 @sm:row-span-2 @sm:row-start-1"
    >
      <ng-content select="[icon]" />
    </div>
    }

    <!-- ========================================== -->
    <!-- ROW 2: Title, Badge, Subtitle (Col 2)       -->
    <!-- ========================================== -->
    <div
      class="col-start-2 row-start-2 flex min-w-0 flex-col gap-0.5 @sm:col-start-2 @sm:row-start-2"
    >
      <div class="flex items-center gap-2.5">
        @if (showParkingSelector()) {
        <app-parking-lot-selector variant="title" />
        } @else {
        <ng-content select="[title]" />
        @if (title()) {
        <nv-h1
          class="text-foreground truncate text-base font-bold tracking-tight @sm:text-2xl"
        >
          {{ title() }}
        </nv-h1>
        } }
        <div class="hidden @sm:block">
          @if (badge()) {
          <nv-badge
            [variant]="badgeVariant()"
            class="shrink-0 text-[10px] font-semibold @sm:text-xs"
          >
            {{ badge() }}
          </nv-badge>
          } @else {
          <ng-content select="[badge]" />
          }
        </div>
      </div>

      @if (subtitle()) {
      <nv-muted
        class="text-muted-foreground block truncate text-xs @sm:text-sm"
      >
        {{ subtitle() }}
      </nv-muted>
      } @else {
      <ng-content select="[subtitle]" />
      }
    </div>

    <!-- ========================================== -->
    <!-- ROW 3: Actions (Desktop col-3 row-2, Mobile col-span-full row-3) -->
    <!-- ========================================== -->
    <div
      class="border-border/60 col-span-full row-start-3 flex shrink-0 flex-wrap items-center gap-2 border-t pt-2.5 @sm:col-span-1 @sm:col-start-3 @sm:row-start-2 @sm:justify-end @sm:border-0 @sm:pt-0"
      data-testid="page-header-actions"
    >
      <ng-content select="[actions]" />
      <ng-content />
    </div>
  </header>
</section>
