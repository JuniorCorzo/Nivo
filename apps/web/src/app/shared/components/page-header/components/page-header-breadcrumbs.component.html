<nav
  aria-label="Ruta de navegación"
  data-testid="page-header-breadcrumb"
  class="text-muted-foreground flex flex-wrap items-center gap-2 font-mono text-xs"
>
  @if (backLink() && !isRoot()) {
    <a
      [routerLink]="backLink()"
      class="text-muted-foreground hover:text-foreground inline-flex items-center gap-1 font-mono text-xs transition-colors"
      [attr.aria-label]="backAriaLabel()"
      [attr.title]="backAriaLabel()"
    >
      <ng-icon name="lucideArrowLeft" size="14" class="shrink-0" />
      <span>{{ backAriaLabel() }}</span>
    </a>
    @if (breadcrumbs().length > 0) {
      <span class="text-border">&gt;</span>
    }
  }

  @for (item of breadcrumbs(); track $index) {
    @if ($index > 0) {
      <span class="text-border">&gt;</span>
    }
    @if (item.url) {
      <a
        [routerLink]="item.url"
        class="hover:text-foreground inline-flex items-center gap-1 transition-colors"
      >
        @if (item.icon) {
          <ng-icon [name]="item.icon" size="12" class="shrink-0" />
        }
        <span>{{ item.label }}</span>
      </a>
    } @else {
      <span
        class="inline-flex items-center gap-1"
        [class.text-foreground]="$last"
        [class.font-semibold]="$last"
      >
        @if (item.icon) {
          <ng-icon [name]="item.icon" size="12" class="shrink-0" />
        }
        <span>{{ item.label }}</span>
      </span>
    }
  }
</nav>
