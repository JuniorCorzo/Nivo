<div class="page-header-mobile flex items-center justify-between gap-2 sm:hidden">
  <div class="flex min-w-0 items-center gap-2 text-xs">
    @if (!isRoot()) {
      <nv-button
        variant="secondary"
        size="icon"
        (click)="back.emit()"
        class="!h-7 !w-7 shrink-0 !rounded-lg"
        [attr.aria-label]="backAriaLabel()"
        data-testid="page-header-mobile-back-btn"
      >
        <ng-icon name="lucideChevronLeft" size="14" class="shrink-0" />
      </nv-button>
    }
    <span
      class="text-muted-foreground max-w-[200px] truncate font-mono text-xs font-medium"
      data-testid="page-header-mobile-path"
    >
      {{ mobilePath() }}
    </span>
  </div>

  @if (badge()) {
    <nv-badge [variant]="badgeVariant()" class="shrink-0 text-[10px] font-bold">
      {{ badge() }}
    </nv-badge>
  } @else {
    <ng-content select="[badge]" />
  }
</div>
