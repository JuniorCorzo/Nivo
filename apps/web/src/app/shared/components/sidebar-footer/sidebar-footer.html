<footer class="flex flex-col gap-2">
  <button
    type="button"
    cdkOverlayOrigin
    #origin="cdkOverlayOrigin"
    (click)="toggleOpen()"
    class="border-border bg-card/60 hover:bg-muted/60 focus-visible:ring-ring flex w-full cursor-pointer items-center justify-between rounded-xl border p-2.5 text-left transition-colors focus-visible:ring-2 focus-visible:outline-none"
    [class.justify-center]="collapsed()"
    [attr.aria-expanded]="isOpen()"
    [attr.title]="collapsed() ? activeParkingName() || texts.changeSede : null"
  >
    @if (!collapsed()) {
    <div class="flex min-w-0 flex-1 flex-col overflow-hidden pr-1 text-left">
      <span class="text-foreground truncate text-xs font-semibold">
        {{ activeParkingName() || texts.selectSede }}
      </span>
      <span class="text-muted-foreground flex items-center gap-1.5 text-[10px]">
        <span
          class="size-1.5 shrink-0 rounded-full bg-emerald-500 shadow-[0_0_6px_rgba(16,185,129,0.5)]"
        ></span>
        <span class="truncate">{{ capacityLabel() }}</span>
      </span>
    </div>
    <ng-icon
      name="lucideChevronsUpDown"
      size="14"
      class="text-muted-foreground shrink-0 transition-transform duration-200"
      [class.rotate-180]="isOpen()"
    />
    } @else {
    <ng-icon
      name="lucideBuilding2"
      size="18"
      class="text-muted-foreground shrink-0"
    />
    }
  </button>

  @if (isOpen()) {
  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="origin"
    [cdkConnectedOverlayOpen]="true"
    [cdkConnectedOverlayPositions]="overlayPositions"
    (overlayOutsideClick)="close()"
    (detach)="close()"
  >
    <div
      class="border-border bg-popover text-popover-foreground animate-in fade-in-0 zoom-in-95 z-50 w-72 rounded-xl border p-2 shadow-xl"
    >
      <div
        class="text-muted-foreground px-2 py-1 text-[11px] font-semibold tracking-wider uppercase"
      >
        {{ texts.availableSedes }}
      </div>

      <div class="max-h-56 space-y-1 overflow-y-auto">
        @for (lot of parkingLots(); track lot.id) { @let isActiveLot =
        activeParkingLot()?.id === lot.id;
        <button
          type="button"
          (click)="selectParkingLot(lot)"
          class="hover:bg-muted/80 focus-visible:ring-ring flex w-full cursor-pointer items-center justify-between rounded-lg px-2.5 py-2 text-left transition-colors focus-visible:ring-2 focus-visible:outline-none"
          [class.bg-muted]="isActiveLot"
        >
          <div class="flex min-w-0 items-center gap-2.5">
            <div
              class="border-border flex size-7 shrink-0 items-center justify-center rounded-md border"
              [class.bg-primary/10]="isActiveLot"
              [class.text-primary]="isActiveLot"
              [class.bg-muted]="!isActiveLot"
              [class.text-muted-foreground]="!isActiveLot"
            >
              <ng-icon name="lucideBuilding2" size="14" />
            </div>
            <div class="flex min-w-0 flex-col">
              <span
                class="truncate text-xs font-medium"
                [class.font-semibold]="isActiveLot"
                [class.text-foreground]="isActiveLot"
              >
                {{ lot.name }}
              </span>
              <span class="text-muted-foreground truncate text-[10px]">
                {{ formatAddress(lot) }}
              </span>
            </div>
          </div>

          @if (isActiveLot) {
          <ng-icon name="lucideCheck" size="14" class="text-primary shrink-0" />
          }
        </button>
        } @empty {
        <div class="text-muted-foreground px-2 py-3 text-center text-xs">
          {{ texts.emptyState }}
        </div>
        }
      </div>

      <div class="border-border mt-2 border-t pt-1.5">
        <a
          [routerLink]="parkingLotsUrl"
          (click)="close()"
          class="hover:bg-muted/60 text-muted-foreground hover:text-foreground flex items-center gap-2 rounded-lg px-2 py-1.5 text-xs font-medium transition-colors"
        >
          <ng-icon name="lucideSettings" size="14" />
          <span>{{ texts.manageSedes }}</span>
        </a>
      </div>
    </div>
  </ng-template>
  }

  <app-user-menu [collapsed]="collapsed()" />
</footer>
