<div cdkOverlayOrigin #origin="cdkOverlayOrigin" class="inline-flex">
  <nv-button
    [variant]="variant()"
    [size]="size()"
    (click)="toggle()"
    (keydown.escape)="close()"
    [attr.aria-expanded]="isOpen()"
    aria-haspopup="menu"
    [attr.aria-label]="ariaLabel()"
    class="aspect-square px-0!"
  >
    <ng-icon name="lucideEllipsis" size="16" />
  </nv-button>
</div>

@if (isOpen()) {
<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="true"
  [cdkConnectedOverlayPositions]="overlayPositions"
  (overlayOutsideClick)="close()"
  (detach)="close()"
>
  <div
    role="menu"
    class="border-border bg-popover text-popover-foreground animate-in fade-in-0 zoom-in-95 z-50 flex min-w-40 flex-col gap-1 rounded-xl border p-1 shadow-lg"
  >
    @if (items(); as list) { @for (item of list; track item.label) {
    <button
      type="button"
      role="menuitem"
      [disabled]="item.disabled"
      (click)="onItemClick(item)"
      class="hover:bg-muted text-foreground flex w-full cursor-pointer items-center gap-2 rounded-lg px-2.5 py-1.5 text-left text-xs transition-colors disabled:cursor-not-allowed disabled:opacity-50"
      [class.text-destructive]="item.variant === 'destructive'"
    >
      @if (item.icon) {
      <ng-icon [name]="item.icon" size="14" class="shrink-0" />
      }
      <span class="truncate">{{ item.label }}</span>
    </button>
    } }
    <ng-content />
  </div>
</ng-template>
}
