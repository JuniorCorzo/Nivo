<nav class="flex min-h-0 flex-1 flex-col gap-3 overflow-y-auto py-1">
  @for (group of navGroups(); track group.label) {
  <div class="flex flex-col gap-1">
    @if (!collapsed()) {
    <div
      class="text-muted-foreground/70 px-3 py-1 text-[10px] font-bold tracking-wider uppercase"
    >
      {{ group.label }}
    </div>
    } @for (item of group.items; track item.label) {
    <a
      [routerLink]="item.url"
      class="hover:bg-muted text-muted-foreground inline-flex h-9 shrink-0 cursor-pointer items-center rounded-md text-sm font-medium transition-all"
      [class.gap-2]="!collapsed()"
      [class.px-3]="!collapsed()"
      [class.justify-between]="!collapsed()"
      [class.justify-center]="collapsed()"
      [class.bg-muted]="item.isActive"
      [class.font-semibold]="item.isActive"
      [class.text-foreground]="item.isActive"
      [class.border]="item.isActive"
      [class.border-border/60]="item.isActive"
      [attr.title]="collapsed() ? item.label : null"
    >
      <div class="flex min-w-0 items-center" [class.gap-2]="!collapsed()">
        <ng-icon [name]="item.icon" size="20" class="shrink-0" />
        @if (!collapsed()) {
        <span class="truncate">{{ item.label }}</span>
        }
      </div>

      @if (!collapsed() && item.hasLiveCount && ticketCount() > 0) {
      <span
        class="py-0.2 shrink-0 rounded-full border border-emerald-500/20 bg-emerald-500/10 px-1.5 font-mono text-[11px] font-bold text-emerald-500"
        >{{ ticketCount() }}</span
      >
      }
    </a>
    }
  </div>
  }
</nav>
<app-sidebar-footer
  class="border-border mt-auto shrink-0 border-t pt-2"
  [collapsed]="collapsed()"
/>
