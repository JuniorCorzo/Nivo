<aside
  class="sidebar border-border flex min-h-full flex-col gap-6 overflow-hidden border-r py-6 transition-[width] duration-300"
  [class.sidebar--collapsed]="collapsed()"
  [class.px-4]="!collapsed()"
  [class.px-2]="collapsed()"
>
  <div
    class="flex w-full items-center"
    [class.justify-between]="!collapsed()"
    [class.flex-col]="collapsed()"
    [class.gap-3]="collapsed()"
  >
    <a
      [routerLink]="homeUrl"
      aria-label="Nivo"
      class="flex shrink-0 items-center justify-center rounded transition-opacity hover:opacity-90 focus:outline-none"
    >
      @if (!collapsed()) {
      <ng-icon
        name="nivo-logo-horizontal"
        class="text-foreground h-fit! w-28!"
      ></ng-icon>
      } @else {
      <ng-icon
        name="nivo-logo-icon"
        class="text-foreground h-8! w-8!"
      ></ng-icon>
      }
    </a>
    <button
      (click)="toggleCollapsed()"
      class="hover:bg-muted flex h-8 w-8 shrink-0 cursor-pointer items-center justify-center rounded-md transition-colors"
      [attr.aria-label]="collapsed() ? 'Expandir sidebar' : 'Colapsar sidebar'"
    >
      <ng-icon
        [name]="collapsed() ? 'lucidePanelLeftOpen' : 'lucidePanelLeftClose'"
        size="18"
      />
    </button>
  </div>
  <nav class="flex flex-1 flex-col gap-2">
    @for (item of navItems(); track $index) {
    <a
      [routerLink]="item.url"
      class="hover:bg-muted inline-flex h-9 cursor-pointer items-center rounded-md font-mono text-base transition-all"
      [class.gap-2]="!collapsed()"
      [class.px-3]="!collapsed()"
      [class.justify-center]="collapsed()"
      [class.bg-muted]="item.isActive"
      [attr.title]="collapsed() ? item.label : null"
    >
      <ng-icon [name]="item.icon" size="20" class="shrink-0" />
      @if (!collapsed()) {
      <span>{{ item.label }}</span>
      }
    </a>
    }
  </nav>
  <app-sidebar-footer [collapsed]="collapsed()" />
</aside>
