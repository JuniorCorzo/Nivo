@if (facade.parking(); as p) {
<div class="mx-auto flex max-w-4xl flex-col gap-6 p-4 sm:p-6 md:p-8">
  <!-- Page Header -->
  <app-page-header
    [title]="facade.title()"
    [subtitle]="facade.description()"
    icon="lucideLayers"
    [breadcrumbs]="breadcrumbs()"
  >
    <div actions class="flex items-center gap-2">
      <nv-button
        variant="outline"
        [routerLink]="APP_ROUTES.app.parkingLotSlots(p.id)"
        size="sm"
        class="border-border bg-card text-foreground hover:bg-accent hover:text-accent-foreground inline-flex cursor-pointer items-center gap-1.5 rounded-xl border text-xs font-semibold transition-colors"
      >
        <ng-icon name="lucideArrowLeft" size="14" />
        <span>Volver al listado</span>
      </nv-button>
    </div>
  </app-page-header>

  <!-- Form Card -->
  <div
    class="bg-card text-card-foreground border-border overflow-hidden rounded-2xl border shadow-xs"
  >
    <div class="flex flex-col gap-6 p-6 sm:p-8">
      @if (facade.mode() === "create") {
      <app-parking-slot-create-form [parkingName]="p.name" />
      } @else {
      <app-parking-slot-edit-form />
      }
    </div>

    <!-- Action Buttons -->
    <div
      class="bg-muted/50 border-border flex items-center justify-end gap-3 border-t p-4 sm:p-6"
    >
      <nv-button
        variant="outline"
        [routerLink]="APP_ROUTES.app.parkingLotSlots(facade.parkingId()!)"
        class="cursor-pointer rounded-xl"
      >
        Cancelar
      </nv-button>
      <nv-button
        [disabled]="facade.isBlocked()"
        (click)="facade.submit()"
        class="bg-primary text-primary-foreground hover:bg-primary/90 inline-flex cursor-pointer items-center gap-2 rounded-xl px-5 py-2.5 text-xs font-semibold shadow-xs transition-all disabled:cursor-not-allowed disabled:opacity-50 sm:text-sm"
      >
        @if (facade.mode() === "create") {
        <ng-icon name="lucidePlus" size="16" />
        } {{ facade.mode() === "create" ? "Crear plazas" : "Guardar cambios" }}
      </nv-button>
    </div>
  </div>
</div>
}
