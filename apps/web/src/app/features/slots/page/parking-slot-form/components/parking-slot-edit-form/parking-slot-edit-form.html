<div class="border-border border-b pb-3">
  <h2 class="text-foreground text-base font-bold">Editar plaza</h2>
  <p class="text-muted-foreground text-xs">
    Modificá los detalles y asignaciones de la plaza
  </p>
</div>

<div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
  <nv-input
    label="Número"
    [placeholder]="texts.edit.fields.number.placeholder"
    [value]="facade.form.number()"
    [disabled]="facade.isNumberLocked()"
    (input)="facade.form.number.set($any($event.target).value)"
  />

  <nv-input
    label="Prefijo"
    [placeholder]="texts.edit.fields.prefix.placeholder"
    [value]="facade.form.prefix()"
    (input)="facade.form.prefix.set($any($event.target).value)"
  />

  <nv-input
    label="Zona"
    [placeholder]="texts.edit.fields.zone.placeholder"
    [value]="facade.form.zone()"
    (input)="facade.form.zone.set($any($event.target).value)"
  />

  <label
    class="text-muted-foreground flex flex-col gap-1.5 text-xs font-semibold tracking-wider uppercase"
  >
    <span>Tipo</span>
    <nv-select
      class="w-full font-normal"
      [items]="slotTypeOptions"
      [displayFn]="displayOptionFn"
      [valueFn]="valueOptionFn"
      [value]="facade.form.type()"
      [disabled]="facade.isTypeLocked()"
      (valueChange)="facade.form.type.set($any($event))"
    />
  </label>

  <label
    class="text-muted-foreground flex flex-col gap-1.5 text-xs font-semibold tracking-wider uppercase"
  >
    <span>Estado</span>
    <nv-select
      class="w-full font-normal"
      [items]="statusOptions"
      [displayFn]="displayOptionFn"
      [valueFn]="valueOptionFn"
      [value]="facade.form.status()"
      (valueChange)="facade.form.status.set($any($event))"
    />
  </label>
</div>

@if (facade.editWarning()) {
<div
  class="border-warning/20 bg-warning/10 text-warning flex items-center gap-2 rounded-xl border p-3 text-xs font-semibold"
>
  <ng-icon name="lucideAlertCircle" size="16" class="shrink-0" />
  <span>{{ facade.editWarning() }}</span>
</div>
}

<!-- Equipamiento y disponibilidad -->
<div class="border-border border-t pt-4">
  <h3 class="text-foreground text-sm font-bold">
    Equipamiento y disponibilidad
  </h3>
  <p class="text-muted-foreground text-xs">
    Modificá las características de equipamiento e infraestructura de la plaza.
  </p>

  <div class="mt-4 flex flex-col gap-3">
    <!-- Cargador Eléctrico -->
    <label
      class="border-border hover:bg-muted/40 flex cursor-pointer items-center justify-between rounded-xl border p-3 transition-colors select-none"
    >
      <div class="flex items-center gap-3">
        <div
          class="bg-info/10 text-info flex h-9 w-9 items-center justify-center rounded-lg"
        >
          <ng-icon name="lucideZap" size="20" />
        </div>
        <div class="flex flex-col">
          <span class="text-foreground text-xs font-semibold"
            >Cargador eléctrico</span
          >
          <span class="text-muted-foreground text-[11px]"
            >Habilitar punto de recarga EV</span
          >
        </div>
      </div>
      <input
        type="checkbox"
        [checked]="facade.form.hasCharger()"
        (change)="
          facade.form.hasCharger.set($any($event.target).checked)
        "
        class="accent-primary h-4 w-4 cursor-pointer rounded"
      />
    </label>

    <!-- Movilidad Reducida (PMR) -->
    <label
      class="border-border hover:bg-muted/40 flex cursor-pointer items-center justify-between rounded-xl border p-3 transition-colors select-none"
    >
      <div class="flex items-center gap-3">
        <div
          class="bg-primary/10 text-primary flex h-9 w-9 items-center justify-center rounded-lg"
        >
          <ng-icon name="lucideAccessibility" size="20" />
        </div>
        <div class="flex flex-col">
          <span class="text-foreground text-xs font-semibold"
            >Movilidad reducida (PMR)</span
          >
          <span class="text-muted-foreground text-[11px]"
            >Plaza accesible para personas con discapacidad</span
          >
        </div>
      </div>
      <input
        type="checkbox"
        [checked]="facade.form.isAccessible()"
        (change)="
          facade.form.isAccessible.set($any($event.target).checked)
        "
        class="accent-primary h-4 w-4 cursor-pointer rounded"
      />
    </label>

    <!-- Plaza Activa / Operativa -->
    <label
      class="border-border hover:bg-muted/40 flex cursor-pointer items-center justify-between rounded-xl border p-3 transition-colors select-none"
    >
      <div class="flex items-center gap-3">
        <div
          class="bg-success/10 text-success flex h-9 w-9 items-center justify-center rounded-lg"
        >
          <ng-icon name="lucideCheckCircle2" size="20" />
        </div>
        <div class="flex flex-col">
          <span class="text-foreground text-xs font-semibold"
            >Plaza activa</span
          >
          <span class="text-muted-foreground text-[11px]"
            >Plaza operativa y habilitada para uso</span
          >
        </div>
      </div>
      <input
        type="checkbox"
        [checked]="facade.form.isActive()"
        (change)="
          facade.form.isActive.set($any($event.target).checked)
        "
        class="accent-primary h-4 w-4 cursor-pointer rounded"
      />
    </label>
  </div>
</div>
