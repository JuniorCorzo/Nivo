<dialog
  #dialog
  class="slot-dialog"
  role="dialog"
  [attr.aria-labelledby]="titleId"
  [attr.aria-describedby]="descriptionId"
  (click)="onBackdropClick($event)"
>
  <div class="slot-dialog__panel">
    <!-- Header -->
    <div
      class="border-border flex items-center justify-between border-b pb-3.5"
    >
      <div>
        <nv-h3 [id]="titleId" class="text-foreground text-base font-bold">
          Editar grupo de plazas
        </nv-h3>
        <span class="text-muted-foreground text-xs">
          Grupo actual: Zona {{ currentZone() || "Sin zona" }} · Prefijo
          {{ currentPrefix() || "Sin prefijo" }}
        </span>
      </div>
      <button
        type="button"
        class="border-border bg-card text-muted-foreground hover:bg-accent hover:text-accent-foreground inline-grid h-8 w-8 cursor-pointer place-items-center rounded-lg border transition-colors"
        (click)="onCancel($event)"
        aria-label="Cerrar"
      >
        <ng-icon name="lucideX" size="16" />
      </button>
    </div>

    <!-- Description -->
    <p
      [id]="descriptionId"
      class="text-muted-foreground mt-4 text-xs leading-relaxed"
    >
      Modificá la zona o prefijo del grupo. La acción renombrará en serie las
      plazas pertenecientes a este grupo.
    </p>

    <!-- Form Fields -->
    <div class="mt-4 flex flex-col gap-3.5">
      <nv-input
        label="Zona"
        placeholder="Ej: NORTE"
        [value]="newZone()"
        (input)="onZoneInput($event)"
      />

      <nv-input
        label="Prefijo"
        placeholder="Ej: A"
        [value]="newPrefix()"
        (input)="onPrefixInput($event)"
      />
    </div>

    <!-- Actions -->
    <div class="border-border mt-5 flex justify-end gap-2.5 border-t pt-3.5">
      <nv-button variant="outline" (click)="onCancel($event)">
        Cancelar
      </nv-button>
      <nv-button
        data-testid="submit-group-btn"
        [disabled]="!hasChanges()"
        (click)="onSubmit()"
      >
        Guardar cambios
      </nv-button>
    </div>
  </div>
</dialog>
