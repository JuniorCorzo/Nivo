<dialog
  #dialog
  class="slot-dialog"
  role="alertdialog"
  [attr.aria-labelledby]="titleId"
  [attr.aria-describedby]="descriptionId"
  (click)="onBackdropClick($event)"
>
  <div class="slot-dialog__panel">
    <div
      class="border-border flex items-center justify-between border-b pb-3.5"
    >
      <nv-h3 [id]="titleId" class="text-foreground text-base font-bold"
        >Eliminar plaza</nv-h3
      >
      <button
        type="button"
        class="border-border bg-card text-muted-foreground hover:bg-accent hover:text-accent-foreground inline-grid h-8 w-8 cursor-pointer place-items-center rounded-lg border transition-colors"
        (click)="onCancel($event)"
        aria-label="Cerrar"
      >
        <ng-icon name="lucideX" size="16" />
      </button>
    </div>

    <p
      [id]="descriptionId"
      class="text-muted-foreground mt-4 text-xs leading-relaxed"
    >
      {{ copy() }}
    </p>

    @if (requiresConfirm()) {
    <div class="mt-4 flex flex-col gap-3">
      <label
        class="border-destructive/20 bg-destructive/10 text-destructive flex cursor-pointer items-start gap-2.5 rounded-xl border p-3 text-xs font-medium select-none"
      >
        <input
          type="checkbox"
          [checked]="confirmChecked()"
          (change)="onConfirmCheckedChange($event)"
          class="accent-destructive mt-0.5 cursor-pointer rounded-sm"
        />
        <span>Entiendo el riesgo y quiero continuar.</span>
      </label>
    </div>
    }

    <div class="border-border mt-5 flex justify-end gap-2.5 border-t pt-3.5">
      <nv-button variant="outline" (click)="onCancel($event)"
        >Cancelar</nv-button
      >
      <nv-button
        variant="destructive"
        [disabled]="requiresConfirm() && !confirmChecked()"
        (click)="confirm.emit()"
      >
        Eliminar plaza
      </nv-button>
    </div>
  </div>
</dialog>
