<dialog
  #dialog
  class="slot-dialog"
  role="alertdialog"
  [attr.aria-labelledby]="titleId"
  [attr.aria-describedby]="descriptionId"
  (click)="onBackdropClick($event)"
>
  <div class="slot-dialog__panel">
    <div class="flex justify-between items-center pb-3.5 border-b border-border">
      <nv-h3 [id]="titleId" class="text-base font-bold text-foreground">Eliminar plaza</nv-h3>
      <button
        type="button"
        class="h-8 w-8 rounded-lg border border-border bg-card text-muted-foreground hover:bg-accent hover:text-accent-foreground inline-grid place-items-center cursor-pointer transition-colors"
        (click)="onCancel($event)"
        aria-label="Cerrar"
      >
        <ng-icon name="lucideX" size="16" />
      </button>
    </div>

    <p [id]="descriptionId" class="text-muted-foreground mt-4 text-xs leading-relaxed">{{ copy() }}</p>

    @if (requiresConfirm()) {
      <div class="flex flex-col gap-3 mt-4">
        <label class="flex gap-2.5 items-start p-3 rounded-xl border border-destructive/20 bg-destructive/10 text-xs font-medium text-destructive cursor-pointer select-none">
          <input
            type="checkbox"
            [checked]="confirmChecked()"
            (change)="onConfirmCheckedChange($event)"
            class="mt-0.5 rounded-sm accent-destructive cursor-pointer"
          />
          <span>Entiendo el riesgo y quiero continuar.</span>
        </label>
      </div>
    }

    <div class="flex justify-end gap-2.5 mt-5 pt-3.5 border-t border-border">
      <nv-button variant="outline" (click)="onCancel($event)">Cancelar</nv-button>
      <nv-button
        variant="destructive"
        [disabled]="requiresConfirm() && !confirmChecked()"
        (click)="confirm.emit()"
      >
        Eliminar plaza
      </nv-button>
    </div>
  </div>
</dialog>
