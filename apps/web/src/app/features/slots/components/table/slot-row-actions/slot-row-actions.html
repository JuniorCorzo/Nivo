<div class="flex justify-end gap-1.5">
  <button
    type="button"
    class="border-border bg-card text-foreground hover:bg-accent hover:text-accent-foreground inline-grid h-8 w-8 cursor-pointer place-items-center rounded-lg border transition-colors"
    title="Ver detalle"
    (click)="viewDetail.emit(slot())"
  >
    <ng-icon name="lucideEye" size="14" />
  </button>
  <button
    type="button"
    class="border-border bg-card text-foreground hover:bg-accent hover:text-accent-foreground inline-grid h-8 w-8 cursor-pointer place-items-center rounded-lg border transition-colors"
    title="Editar"
    (click)="edit.emit(slot())"
  >
    <ng-icon name="lucidePencil" size="14" />
  </button>
  <button
    type="button"
    class="border-border bg-card text-foreground hover:bg-accent hover:text-accent-foreground inline-grid h-8 w-8 cursor-pointer place-items-center rounded-lg border transition-colors"
    title="Cambiar estado"
    (click)="changeStatus.emit(slot())"
  >
    <ng-icon name="lucideToggleLeft" size="14" />
  </button>
  <button
    type="button"
    class="border-border bg-card text-destructive hover:bg-destructive/10 inline-grid h-8 w-8 cursor-pointer place-items-center rounded-lg border transition-colors"
    title="Eliminar"
    (click)="delete.emit(slot())"
  >
    <ng-icon name="lucideTrash2" size="14" />
  </button>
</div>
