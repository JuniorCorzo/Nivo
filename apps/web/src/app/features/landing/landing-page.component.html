<div
  class="min-h-screen bg-[var(--background)] text-[var(--foreground)] selection:bg-[var(--primary)] selection:text-[var(--primary-foreground)]"
>
  <app-landing-navbar
    (loginClick)="goToLogin()"
    (registerClick)="goToRegister()"
  />

  <main>
    <app-landing-hero
      (trySimulatorClick)="scrollToSimulator()"
      (registerClick)="goToRegister()"
    />

    <app-landing-benefits />

    <app-landing-simulator
      [vehicleType]="vehicleType()"
      [minutesStayed]="minutesStayed()"
      [pricePerUnit]="pricePerUnit()"
      [gracePeriodMinutes]="gracePeriodMinutes()"
      [ivaRate]="ivaRate()"
      [simulationResult]="simulationResult()"
      [isCalculating]="isCalculating()"
      (vehicleTypeChange)="selectVehicle($event)"
      (durationChange)="setDuration($event)"
      (registerClick)="goToRegister()"
    />

    <app-landing-comparison />

    <app-landing-pricing (registerClick)="goToRegister()" />
  </main>

  <app-landing-footer (ctaClick)="goToRegister()" />
</div>
