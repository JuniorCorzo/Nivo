<section id="beneficios" class="border-border border-t py-20">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="mx-auto max-w-3xl text-center">
      <nv-badge variant="outline" class="mb-3">{{ texts.badge }}</nv-badge>
      <nv-h2 class="text-3xl font-bold">{{ texts.title }}</nv-h2>
      <nv-p class="text-muted-foreground mt-3">
        {{ texts.description }}
      </nv-p>
    </div>

    <div class="mt-14 grid grid-cols-1 gap-8 md:grid-cols-2 lg:grid-cols-4">
      @for (item of texts.items; track item.title) {
        <nv-card
          class="border-border bg-card hover:border-primary/40 flex flex-col justify-between p-6 shadow-xs transition-all duration-300 hover:-translate-y-1 hover:shadow-lg"
        >
          <div>
            <div
              class="border-success/30 bg-success/10 text-success mb-4 flex h-12 w-12 items-center justify-center rounded-lg border"
            >
              <ng-icon [name]="item.icon" size="24" />
            </div>
            <nv-h4 class="text-lg font-semibold">{{ item.title }}</nv-h4>
            <nv-muted class="mt-2 block leading-relaxed">
              {{ item.description }}
            </nv-muted>
          </div>
        </nv-card>
      }
    </div>
  </div>
</section>
