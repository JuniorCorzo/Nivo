<section
  id="beneficios"
  class="border-t border-[var(--border)] bg-[var(--card)]/40 py-20"
>
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="mx-auto max-w-3xl text-center">
      <nv-badge variant="outline" class="mb-3">{{ texts.badge }}</nv-badge>
      <nv-h2 class="text-3xl font-bold">{{ texts.title }}</nv-h2>
      <nv-p class="mt-3 text-[var(--muted-foreground)]">
        {{ texts.description }}
      </nv-p>
    </div>

    <div class="mt-14 grid grid-cols-1 gap-8 md:grid-cols-2 lg:grid-cols-4">
      @for (item of texts.items; track item.title) {
        <nv-card class="flex flex-col justify-between p-6">
          <div>
            <div
              class="mb-4 flex h-12 w-12 items-center justify-center rounded-lg border border-[var(--border)] bg-[var(--muted)] text-[var(--foreground)]"
            >
              <ng-icon [name]="item.icon" size="24" />
            </div>
            <nv-h4 class="text-lg font-semibold">{{ item.title }}</nv-h4>
            <nv-muted class="mt-2 block leading-relaxed">
              {{ item.description }}
            </nv-muted>
          </div>
        </nv-card>
      }
    </div>
  </div>
</section>
