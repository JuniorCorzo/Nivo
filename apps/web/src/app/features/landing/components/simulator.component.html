<section id="simulador" class="py-20">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="mx-auto mb-14 max-w-3xl text-center">
      <nv-badge variant="outline" class="mb-3">{{ texts.badge }}</nv-badge>
      <nv-h2 class="text-3xl font-bold">{{ texts.title }}</nv-h2>
      <nv-p class="mt-3 text-[var(--muted-foreground)]">
        {{ texts.description }}
      </nv-p>
    </div>

    <div class="mx-auto grid max-w-6xl grid-cols-1 gap-8 lg:grid-cols-12">
      <app-simulator-controls
        class="lg:col-span-7"
        [vehicleType]="vehicleType()"
        [minutesStayed]="minutesStayed()"
        [pricePerUnit]="pricePerUnit()"
        [gracePeriodMinutes]="gracePeriodMinutes()"
        [ivaRate]="ivaRate()"
        (vehicleTypeChange)="vehicleTypeChange.emit($event)"
        (durationChange)="durationChange.emit($event)"
      />

      <app-simulator-ticket
        class="lg:col-span-5"
        [vehicleType]="vehicleType()"
        [minutesStayed]="minutesStayed()"
        [simulationResult]="simulationResult()"
        (registerClick)="registerClick.emit()"
      />
    </div>
  </div>
</section>
