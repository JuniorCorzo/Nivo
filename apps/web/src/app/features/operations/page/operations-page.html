<div class="flex flex-col gap-5 p-4 sm:p-6 lg:p-8">
  <!-- Top Bar: Navigation, Parking Name & Quick Actions -->
  <app-page-header
    [title]="texts.header.title"
    [badge]="texts.header.badgeLive"
    badgeVariant="success"
  >
    <div
      subtitle
      class="text-muted-foreground flex items-center gap-1.5 text-xs"
    >
      @if (facade.parking(); as currentParking) {
      <span class="text-foreground font-semibold"
        >{{ currentParking.name }}</span
      >
      <span>·</span>
      }
      <span>{{ texts.header.subtitle }}</span>
    </div>
    @if (facade.parkingId(); as pId) {
    <div actions class="flex items-center gap-2">
      <a
        [routerLink]="APP_ROUTES.app.parkingLotTickets(pId)"
        class="border-border bg-card text-foreground hover:bg-muted/80 focus-visible:ring-ring inline-flex cursor-pointer items-center gap-1.5 rounded-lg border px-3 py-1.5 text-xs font-semibold shadow-xs transition-colors focus-visible:ring-2 focus-visible:outline-none"
        [title]="texts.header.ticketsTitle"
      >
        <ng-icon name="lucideTicket" class="text-sm" />
        <span>{{ texts.header.viewTicketsAction }}</span>
      </a>
    </div>
    }
  </app-page-header>

  <app-operations-kpi-ribbon [metrics]="facade.kpiMetrics()" />

  <app-operations-omnibar
    [state]="facade.omnibarState()"
    (action)="facade.handleOmnibarAction($event)"
  />

  <app-operations-slots-grid
    [filteredSlots]="facade.filteredSlots()"
    [filters]="facade.slotsGridFilters()"
    [activeTickets]="facade.activeTickets()"
    (filterAction)="facade.handleSlotsFilterAction($event)"
    (slotClick)="facade.onSlotClick($event)"
  />

  <app-operations-active-tickets-table
    [filteredActiveTickets]="facade.filteredActiveTickets()"
    [searchTicketQuery]="facade.searchTicketQuery()"
    (searchTicketQueryChange)="facade.setSearchTicketQuery($event)"
    (submitExpressCheckOut)="facade.submitExpressCheckOutByQuery()"
    (openQrScanner)="facade.openQrScanner()"
    (checkOutWithTicket)="facade.checkOutWithTicket($event)"
  />
</div>

<app-check-in-modal
  [isOpen]="facade.isCheckInModalOpen()"
  [parkingId]="facade.parkingId()"
  [preselectedSlot]="facade.selectedCheckInSlot()"
  [initialUnplated]="facade.checkInModalInitialUnplated()"
  [initialPlate]="facade.checkInModalInitialPlate()"
  (closed)="facade.closeCheckInModal()"
/>

@defer (when facade.isCheckOutModalOpen()) {
<app-check-out-modal
  [isOpen]="facade.isCheckOutModalOpen()"
  [parkingId]="facade.parkingId()"
  [ticket]="facade.selectedCheckoutTicket()"
  (closed)="facade.closeCheckOutModal()"
/>
} @defer (when facade.isQrScannerOpen()) {
<app-qr-scanner-modal
  [isOpen]="facade.isQrScannerOpen()"
  (closed)="facade.closeQrScanner()"
  (scanned)="facade.onQrScanned($event)"
/>
}
