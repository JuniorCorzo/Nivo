<div class="flex flex-col gap-5 p-4 sm:p-6 lg:p-8">
  <!-- Top Bar: Navigation, Parking Name & Quick Actions -->
  <app-page-header
    [title]="texts.header.title"
    [badge]="texts.header.badgeLive"
    badgeVariant="success"
  >
    @if (parking(); as currentParking) {
    <div
      slot="subtitle"
      class="text-muted-foreground flex items-center gap-1.5 text-xs"
    >
      <span class="text-foreground font-semibold">
        {{ currentParking.name }}
      </span>
      <span>·</span>
      <span>{{ texts.header.subtitle }}</span>
    </div>
    <div slot="actions" class="flex items-center gap-2">
      <a
        [routerLink]="APP_ROUTES.app.tickets"
        class="border-border bg-card text-foreground hover:bg-muted/80 focus-visible:ring-ring inline-flex cursor-pointer items-center gap-1.5 rounded-lg border px-3 py-1.5 text-xs font-semibold shadow-xs transition-colors focus-visible:ring-2 focus-visible:outline-none"
        [title]="texts.header.ticketsTitle"
      >
        <ng-icon name="lucideTicket" class="text-sm" />
        <span>{{ texts.header.viewTicketsAction }}</span>
      </a>
    </div>
    }
  </app-page-header>

  <!-- Unified KPI Ribbon: Capacidad Global, Carros, Motos, Vehículos Activos -->
  <app-operations-kpi-ribbon
    [totalSlotsCount]="totalSlotsCount()"
    [availableSlotsCount]="availableSlotsCount()"
    [occupationPercentage]="occupationPercentage()"
    [occupationBarPercentage]="occupationBarPercentage()"
    [totalCarSlotsCount]="totalCarSlotsCount()"
    [availableCarSlotsCount]="availableCarSlotsCount()"
    [totalMotoSlotsCount]="totalMotoSlotsCount()"
    [availableMotoSlotsCount]="availableMotoSlotsCount()"
    [occupiedSlotsCount]="occupiedSlotsCount()"
  />

  <!-- Omnibar Táctico de Taquilla (Dual Action Bar: Ingreso Exprés + Salida Exprés) -->
  <app-operations-omnibar
    [hasMultipleVehicleTypes]="hasMultipleVehicleTypes()"
    [expressVehicleType]="expressVehicleType()"
    [expressPlate]="expressPlate()"
    [isSubmittingExpressCheckIn]="isSubmittingExpressCheckIn()"
    [availableCarSlotsCount]="availableCarSlotsCount()"
    [availableMotoSlotsCount]="availableMotoSlotsCount()"
    [searchTicketQuery]="searchTicketQuery()"
    (expressVehicleTypeChange)="setExpressVehicleType($event)"
    (expressPlateChange)="expressPlate.set($event)"
    (submitExpressCheckIn)="submitExpressCheckIn()"
    (openUnplatedCheckIn)="openCheckInModal(true)"
    (searchTicketQueryChange)="searchTicketQuery.set($event)"
    (submitExpressCheckOut)="submitExpressCheckOutByQuery()"
    (openQrScanner)="openQrScanner()"
  />

  <!-- Active Operations / Live Slots & Search Section -->
  <app-operations-slots-grid
    [filteredSlots]="filteredSlots()"
    [vehicleFilter]="vehicleFilter()"
    [statusFilter]="statusFilter()"
    [activeTickets]="activeTickets()"
    (vehicleFilterChange)="setVehicleFilter($event)"
    (statusFilterChange)="setStatusFilter($event)"
    (resetFilters)="resetSlotFilters()"
    (slotClick)="onSlotClick($event)"
  />

  <!-- Live Operations Table: Vehículos Activos en Taquilla -->
  <app-operations-active-tickets-table
    [filteredActiveTickets]="filteredActiveTickets()"
    [searchTicketQuery]="searchTicketQuery()"
    (searchTicketQueryChange)="searchTicketQuery.set($event)"
    (submitExpressCheckOut)="submitExpressCheckOutByQuery()"
    (openQrScanner)="openQrScanner()"
    (checkOutWithTicket)="checkOutWithTicket($event)"
  />
</div>

<!-- Check-in Modal Component -->
<app-check-in-modal
  [isOpen]="isCheckInModalOpen()"
  [parkingId]="parkingId()"
  [preselectedSlot]="selectedCheckInSlot()"
  [initialUnplated]="checkInModalInitialUnplated()"
  [initialPlate]="checkInModalInitialPlate()"
  (closed)="closeCheckInModal()"
/>

<!-- Check-out Modal Component -->
@defer (when isCheckOutModalOpen()) {
<app-check-out-modal
  [isOpen]="isCheckOutModalOpen()"
  [parkingId]="parkingId()"
  [ticket]="selectedCheckoutTicket()"
  (closed)="closeCheckOutModal()"
/>
}

<!-- QR Scanner Modal Component -->
@defer (when isQrScannerOpen()) {
<app-qr-scanner-modal
  [isOpen]="isQrScannerOpen()"
  (closed)="closeQrScanner()"
  (scanned)="onQrScanned($event)"
/>
}
