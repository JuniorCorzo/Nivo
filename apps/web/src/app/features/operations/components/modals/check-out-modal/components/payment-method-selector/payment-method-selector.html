@if (!isZeroPayment()) {
<div class="space-y-2">
  <div class="flex items-center justify-between">
    <label
      class="text-muted-foreground block text-xs font-semibold tracking-wider uppercase"
    >
      {{ texts.paymentMethod }}
    </label>
    <span class="text-muted-foreground text-[11px]">
      {{ isPaymentModuleEnabled() ? texts.selectPaymentMethod :
      texts.methods.effectiveOnlyNotice }}
    </span>
  </div>

  <div
    class="grid grid-cols-1 gap-2.5"
    [class.sm:grid-cols-3]="isPaymentModuleEnabled()"
  >
    <!-- Option 1: Efectivo -->
    <button
      type="button"
      (click)="selectPaymentMethod('EFFECTIVE')"
      [class.border-primary]="isPaymentMethodActive('EFFECTIVE')"
      [class.bg-primary/10]="isPaymentMethodActive('EFFECTIVE')"
      [class.text-primary]="isPaymentMethodActive('EFFECTIVE')"
      [class.ring-2]="isPaymentMethodActive('EFFECTIVE')"
      [class.ring-primary/20]="isPaymentMethodActive('EFFECTIVE')"
      [class.border-border]="!isPaymentMethodActive('EFFECTIVE')"
      [class.bg-card]="!isPaymentMethodActive('EFFECTIVE')"
      [class.text-muted-foreground]="!isPaymentMethodActive('EFFECTIVE')"
      class="hover:border-primary/50 hover:bg-muted/50 hover:text-foreground focus-visible:ring-ring flex cursor-pointer flex-col items-center justify-center gap-1.5 rounded-xl border p-3 text-center transition-all duration-200 focus-visible:ring-2 focus-visible:outline-none sm:items-start sm:text-left"
    >
      <div class="flex items-center gap-2">
        <ng-icon name="lucideCoins" class="text-lg" />
        <span class="text-foreground text-xs font-bold"
          >{{ texts.methods.effective }}</span
        >
      </div>
      <span class="text-muted-foreground text-[11px]"
        >{{ texts.methods.effectiveSubtitle }}</span
      >
    </button>

    @if (isPaymentModuleEnabled()) {
    <!-- Option 2: Tarjeta / Datáfono -->
    <button
      type="button"
      (click)="selectPaymentMethod('PAY_LINK')"
      [class.border-primary]="isPaymentMethodActive('PAY_LINK')"
      [class.bg-primary/10]="isPaymentMethodActive('PAY_LINK')"
      [class.text-primary]="isPaymentMethodActive('PAY_LINK')"
      [class.ring-2]="isPaymentMethodActive('PAY_LINK')"
      [class.ring-primary/20]="isPaymentMethodActive('PAY_LINK')"
      [class.border-border]="!isPaymentMethodActive('PAY_LINK')"
      [class.bg-card]="!isPaymentMethodActive('PAY_LINK')"
      [class.text-muted-foreground]="!isPaymentMethodActive('PAY_LINK')"
      class="hover:border-primary/50 hover:bg-muted/50 hover:text-foreground focus-visible:ring-ring flex cursor-pointer flex-col items-center justify-center gap-1.5 rounded-xl border p-3 text-center transition-all duration-200 focus-visible:ring-2 focus-visible:outline-none sm:items-start sm:text-left"
    >
      <div class="flex items-center gap-2">
        <ng-icon name="lucideCreditCard" class="text-lg" />
        <span class="text-foreground text-xs font-bold"
          >{{ texts.methods.card }}</span
        >
      </div>
      <span class="text-muted-foreground text-[11px]"
        >{{ texts.methods.cardSubtitle }}</span
      >
    </button>

    <!-- Option 3: Transferencia / QR Bancario -->
    <button
      type="button"
      (click)="selectPaymentMethod('TRANSFER')"
      [class.border-primary]="isPaymentMethodActive('TRANSFER')"
      [class.bg-primary/10]="isPaymentMethodActive('TRANSFER')"
      [class.text-primary]="isPaymentMethodActive('TRANSFER')"
      [class.ring-2]="isPaymentMethodActive('TRANSFER')"
      [class.ring-primary/20]="isPaymentMethodActive('TRANSFER')"
      [class.border-border]="!isPaymentMethodActive('TRANSFER')"
      [class.bg-card]="!isPaymentMethodActive('TRANSFER')"
      [class.text-muted-foreground]="!isPaymentMethodActive('TRANSFER')"
      class="hover:border-primary/50 hover:bg-muted/50 hover:text-foreground focus-visible:ring-ring flex cursor-pointer flex-col items-center justify-center gap-1.5 rounded-xl border p-3 text-center transition-all duration-200 focus-visible:ring-2 focus-visible:outline-none sm:items-start sm:text-left"
    >
      <div class="flex items-center gap-2">
        <ng-icon name="lucideQrCode" class="text-lg" />
        <span class="text-foreground text-xs font-bold"
          >{{ texts.methods.transfer }}</span
        >
      </div>
      <span class="text-muted-foreground text-[11px]"
        >{{ texts.methods.transferSubtitle }}</span
      >
    </button>
    }
  </div>
</div>
}
