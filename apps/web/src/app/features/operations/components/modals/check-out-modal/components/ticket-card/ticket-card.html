<button
  type="button"
  (click)="selected.emit(ticket())"
  class="border-border hover:border-primary/60 hover:bg-accent/40 focus-visible:ring-ring group flex w-full cursor-pointer items-center justify-between rounded-xl border p-3 text-left transition-all focus-visible:ring-2 focus-visible:outline-none"
>
  <div class="flex items-center gap-3">
    <div
      class="bg-primary/10 text-primary group-hover:bg-primary group-hover:text-primary-foreground flex h-10 w-10 shrink-0 items-center justify-center rounded-lg transition-colors"
    >
      <ng-icon name="lucideCar" class="text-lg" />
    </div>
    <div>
      <div class="flex items-center gap-2">
        <span
          class="text-foreground group-hover:text-primary font-mono text-base font-bold transition-colors"
        >
          {{ ticket().licensePlate | appPlateFormat: ticket().plateCountry }}
        </span>
        @if (ticket().slotNumber) {
        <nv-badge variant="outline" class="px-1.5 py-0.5 text-[10px]">
          {{ texts.settlement.slot }} {{ ticket().slotNumber }}
        </nv-badge>
        } @if (ticket().slotType) {
        <nv-badge variant="info" class="px-1.5 py-0.5 text-[10px]">
          {{ ticket().slotType }}
        </nv-badge>
        }
      </div>
      @if (ticket().entryTime) {
      <div
        class="text-muted-foreground mt-0.5 flex items-center gap-1 text-[11px]"
      >
        <ng-icon name="lucideClock" class="text-xs" />
        <span
          >{{ texts.identification.entry }}: {{ ticket().entryTime | date:
          "shortTime" }}</span
        >
      </div>
      }
    </div>
  </div>

  <div
    class="text-primary inline-flex items-center gap-1 text-xs font-semibold"
  >
    <span>{{ texts.identification.selectAction }}</span>
    <ng-icon name="lucideArrowRight" class="text-xs" />
  </div>
</button>
