@if (isOpen()) {
<div
  class="animate-in fade-in fixed inset-0 z-50 flex items-end justify-center bg-black/60 p-0 backdrop-blur-xs duration-200 sm:items-center sm:p-4"
>
  <div
    class="border-border bg-card text-card-foreground relative max-h-[90vh] w-full max-w-lg overflow-y-auto rounded-t-2xl border p-5 shadow-2xl transition-all sm:rounded-2xl sm:p-6"
  >
    <!-- Header -->
    <div class="border-border flex items-center justify-between border-b pb-4">
      <div class="flex items-center gap-3">
        <div
          class="bg-warning/10 text-warning border-warning/20 flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border"
        >
          <ng-icon name="lucideLogOut" class="text-xl" />
        </div>
        <div>
          <h2 class="text-foreground text-base font-bold sm:text-lg">
            {{ texts.title }}
          </h2>
          <p class="text-muted-foreground text-xs">{{ texts.subtitle }}</p>
        </div>
      </div>
      <nv-button
        variant="ghost"
        size="icon"
        type="button"
        (click)="onClose()"
        class="text-muted-foreground"
        [attr.aria-label]="texts.close"
      >
        <ng-icon name="lucideX" class="text-lg" />
      </nv-button>
    </div>

    <!-- Stepper Indicator -->
    <app-checkout-stepper [activeStep]="facade.activeStep()" />

    <!-- Error Alert -->
    @if (facade.errorMessage()) {
    <div
      class="border-destructive/20 bg-destructive/10 text-destructive mt-4 flex items-start gap-2.5 rounded-lg border p-3 text-xs"
    >
      <ng-icon name="lucideAlertCircle" class="mt-0.5 shrink-0 text-base" />
      <span>{{ facade.errorMessage() }}</span>
    </div>
    }

    <!-- Step Flow Content -->
    <div class="mt-4">
      @if (!facade.selectedTicket() || facade.activeStep() === 1) {
      <!-- Step 1: Identification & Selection -->
      <app-identification-step />

      <div class="border-border mt-6 flex justify-end border-t pt-3">
        <nv-button
          type="button"
          variant="outline"
          (click)="onClose()"
          class="w-full sm:w-auto"
        >
          {{ texts.close }}
        </nv-button>
      </div>
      } @else if (facade.activeStep() === 2) {
      <!-- Step 2: Tariff Settlement & Real-time Timeline -->
      <app-settlement-step
        (continue)="facade.proceedToPayment()"
        (nextStep)="facade.proceedToPayment()"
        (changeVehicle)="facade.clearSelectedTicket()"
      />
      } @else if (facade.activeStep() === 3) {
      <!-- Step 3: Payment Method & Delivery -->
      <app-payment-step
        (back)="facade.backToSettlement()"
        (confirm)="onConfirmCheckOut()"
      />
      }
    </div>
  </div>
</div>
}

<!-- Exit Receipt Modal -->
<app-ticket-receipt
  [isOpen]="facade.isReceiptOpen()"
  [ticket]="facade.lastPaymentRecord()?.ticket || facade.selectedTicket()"
  [payment]="facade.lastPaymentRecord()"
  [title]="texts.receipt.title"
  [subtitle]="texts.receipt.subtitle"
  (closed)="facade.closeReceipt()"
/>
