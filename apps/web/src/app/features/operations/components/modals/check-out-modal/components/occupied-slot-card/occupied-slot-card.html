<button
  type="button"
  (click)="selected.emit(slot())"
  class="border-border hover:border-primary/60 hover:bg-accent/40 focus-visible:ring-ring group flex cursor-pointer flex-col justify-between rounded-xl border p-3 text-left transition-all focus-visible:ring-2 focus-visible:outline-none"
>
  <div class="flex w-full items-center justify-between">
    <span
      class="text-muted-foreground text-[10px] font-bold tracking-wider uppercase"
    >
      {{ slot().zone ? slot().zone : texts.identification.defaultSlotZone }}
    </span>
    <nv-badge variant="info" class="px-1.5 py-0.5 text-[10px]">
      {{ texts.identification.occupiedBadge }}
    </nv-badge>
  </div>

  <div class="my-2">
    <div
      class="text-foreground group-hover:text-primary font-mono text-base font-bold transition-colors"
    >
      {{ slot().prefix ? slot().prefix + "-" : "" }}{{ slot().slotNumber }}
    </div>
    <span class="text-muted-foreground text-[10px] font-medium uppercase">
      {{ slot().type }}
    </span>
  </div>

  <div
    class="text-primary inline-flex items-center gap-1 text-[11px] font-semibold"
  >
    <span>{{ texts.identification.processAction }}</span>
    <ng-icon name="lucideArrowRight" class="text-xs" />
  </div>
</button>
