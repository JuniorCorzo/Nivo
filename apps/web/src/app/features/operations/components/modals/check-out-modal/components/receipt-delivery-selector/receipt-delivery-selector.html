<div class="space-y-2">
  <label
    class="text-muted-foreground block text-xs font-semibold tracking-wider uppercase"
  >
    {{ texts.deliveryMethod }}
  </label>
  <div
    role="group"
    aria-label="Método de entrega de comprobante"
    class="grid grid-cols-2 gap-2"
  >
    <button
      type="button"
      (click)="selectSendVia('URL')"
      [class.border-primary]="sendVia() === 'URL'"
      [class.bg-primary/10]="sendVia() === 'URL'"
      [class.text-primary]="sendVia() === 'URL'"
      [class.ring-2]="sendVia() === 'URL'"
      [class.ring-primary/20]="sendVia() === 'URL'"
      [class.border-border]="sendVia() !== 'URL'"
      [class.bg-card]="sendVia() !== 'URL'"
      [class.text-muted-foreground]="sendVia() !== 'URL'"
      class="hover:bg-accent hover:text-accent-foreground focus-visible:ring-ring flex cursor-pointer items-center justify-center gap-2 rounded-xl border px-3 py-2.5 text-xs font-semibold transition-all duration-200 focus-visible:ring-2 focus-visible:outline-none"
    >
      <ng-icon name="lucidePrinter" class="text-base" />
      <span>{{ texts.deliveryOptions.screen }}</span>
    </button>

    <button
      type="button"
      (click)="selectSendVia('EMAIL')"
      [class.border-primary]="sendVia() === 'EMAIL'"
      [class.bg-primary/10]="sendVia() === 'EMAIL'"
      [class.text-primary]="sendVia() === 'EMAIL'"
      [class.ring-2]="sendVia() === 'EMAIL'"
      [class.ring-primary/20]="sendVia() === 'EMAIL'"
      [class.border-border]="sendVia() !== 'EMAIL'"
      [class.bg-card]="sendVia() !== 'EMAIL'"
      [class.text-muted-foreground]="sendVia() !== 'EMAIL'"
      class="hover:bg-accent hover:text-accent-foreground focus-visible:ring-ring flex cursor-pointer items-center justify-center gap-2 rounded-xl border px-3 py-2.5 text-xs font-semibold transition-all duration-200 focus-visible:ring-2 focus-visible:outline-none"
    >
      <ng-icon name="lucideMail" class="text-base" />
      <span>{{ texts.deliveryOptions.email }}</span>
    </button>
  </div>

  <!-- Animated Email Input when EMAIL is selected -->
  @if (sendVia() === "EMAIL") {
  <div
    class="animate-in fade-in slide-in-from-top-1 border-border bg-card/50 space-y-1.5 rounded-xl border p-3 duration-200"
  >
    <nv-input
      id="receipt-email-input"
      type="email"
      [label]="texts.customerEmail"
      [placeholder]="texts.customerEmailPlaceholder"
      [hint]="texts.customerEmailHint"
      [error]="emailErrors()"
      startIcon="lucideMail"
      [value]="receiptEmail()"
      (input)="onEmailInput($event)"
      (focusout)="onEmailBlur()"
    />
  </div>
  }
</div>
