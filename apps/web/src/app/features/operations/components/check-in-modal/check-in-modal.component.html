@if (isOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-xs p-4 animate-in fade-in duration-200">
    <div
      class="relative w-full max-w-lg rounded-2xl border border-neutral-200 bg-white p-6 shadow-2xl dark:border-neutral-800 dark:bg-neutral-900 transition-all"
    >
      <!-- Header -->
      <div class="flex items-center justify-between pb-4 border-b border-neutral-100 dark:border-neutral-800">
        <div class="flex items-center gap-3">
          <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-primary-50 text-primary-600 dark:bg-primary-950/40 dark:text-primary-400">
            <ng-icon name="lucideLogIn" class="text-xl" />
          </div>
          <div>
            <h2 class="text-lg font-bold text-neutral-900 dark:text-neutral-50">Registrar Ingreso de Vehículo</h2>
            <p class="text-xs text-neutral-500 dark:text-neutral-400">Asignar cupo y emitir ticket de parqueo</p>
          </div>
        </div>
        <button
          type="button"
          (click)="onClose()"
          class="rounded-lg p-1.5 text-neutral-400 hover:bg-neutral-100 hover:text-neutral-700 dark:hover:bg-neutral-800 dark:hover:text-neutral-200 transition-colors"
        >
          <ng-icon name="lucideX" class="text-lg" />
        </button>
      </div>

      <!-- Error Alert -->
      @if (facade.errorMessage()) {
        <div class="mt-4 flex items-start gap-2.5 rounded-lg border border-red-200 bg-red-50 p-3 text-xs text-red-800 dark:border-red-900/50 dark:bg-red-950/30 dark:text-red-300">
          <ng-icon name="lucideAlertCircle" class="text-base shrink-0 mt-0.5" />
          <span>{{ facade.errorMessage() }}</span>
        </div>
      }

      <!-- Form Body -->
      <form class="mt-4 space-y-4" (submit)="onSubmit($event)">
        <!-- Vehicle Type Selector -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-600 dark:text-neutral-300 mb-1.5">
            Tipo de Vehículo
          </label>
          <div class="grid grid-cols-3 gap-2">
            <button
              type="button"
              (click)="facade.setVehicleType('CAR')"
              [class.border-primary-500]="facade.vehicleType() === 'CAR'"
              [class.bg-primary-50]="facade.vehicleType() === 'CAR'"
              [class.dark:bg-primary-950/40]="facade.vehicleType() === 'CAR'"
              [class.text-primary-700]="facade.vehicleType() === 'CAR'"
              [class.dark:text-primary-300]="facade.vehicleType() === 'CAR'"
              class="flex flex-col items-center justify-center p-3 rounded-xl border border-neutral-200 dark:border-neutral-700 text-neutral-700 dark:text-neutral-200 hover:border-neutral-300 dark:hover:border-neutral-600 transition-colors font-medium text-xs gap-1"
            >
              <ng-icon name="lucideCar" class="text-lg" />
              <span>Automóvil</span>
            </button>

            <button
              type="button"
              (click)="facade.setVehicleType('MOTORCYCLE')"
              [class.border-primary-500]="facade.vehicleType() === 'MOTORCYCLE'"
              [class.bg-primary-50]="facade.vehicleType() === 'MOTORCYCLE'"
              [class.dark:bg-primary-950/40]="facade.vehicleType() === 'MOTORCYCLE'"
              [class.text-primary-700]="facade.vehicleType() === 'MOTORCYCLE'"
              [class.dark:text-primary-300]="facade.vehicleType() === 'MOTORCYCLE'"
              class="flex flex-col items-center justify-center p-3 rounded-xl border border-neutral-200 dark:border-neutral-700 text-neutral-700 dark:text-neutral-200 hover:border-neutral-300 dark:hover:border-neutral-600 transition-colors font-medium text-xs gap-1"
            >
              <ng-icon name="lucideBike" class="text-lg" />
              <span>Motocicleta</span>
            </button>

            <button
              type="button"
              (click)="facade.setVehicleType('BIKE')"
              [class.border-primary-500]="facade.vehicleType() === 'BIKE'"
              [class.bg-primary-50]="facade.vehicleType() === 'BIKE'"
              [class.dark:bg-primary-950/40]="facade.vehicleType() === 'BIKE'"
              [class.text-primary-700]="facade.vehicleType() === 'BIKE'"
              [class.dark:text-primary-300]="facade.vehicleType() === 'BIKE'"
              class="flex flex-col items-center justify-center p-3 rounded-xl border border-neutral-200 dark:border-neutral-700 text-neutral-700 dark:text-neutral-200 hover:border-neutral-300 dark:hover:border-neutral-600 transition-colors font-medium text-xs gap-1"
            >
              <ng-icon name="lucideBike" class="text-lg" />
              <span>Bicicleta</span>
            </button>
          </div>
        </div>

        <!-- License Plate Input -->
        <div>
          <label for="plate-input" class="block text-xs font-semibold uppercase tracking-wider text-neutral-600 dark:text-neutral-300 mb-1.5">
            Placa / Matrícula <span class="text-red-500">*</span>
          </label>
          <div class="relative">
            <input
              id="plate-input"
              #plateInput
              type="text"
              [value]="facade.plate()"
              (input)="onPlateInput($event)"
              (keydown.enter)="onEnterKey($event)"
              placeholder="Ej: ABC123"
              maxlength="10"
              autocomplete="off"
              class="w-full rounded-xl border border-neutral-300 dark:border-neutral-700 bg-neutral-50/50 dark:bg-neutral-800/60 px-4 py-3 text-lg font-bold font-mono uppercase tracking-widest text-neutral-900 dark:text-neutral-100 placeholder:text-neutral-400 placeholder:font-normal placeholder:tracking-normal focus:border-primary-500 focus:bg-white dark:focus:bg-neutral-800 focus:outline-hidden transition-all"
            />
            <div class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-mono text-neutral-400">
              ↵ Enter
            </div>
          </div>
        </div>

        <!-- Capacity Warning if full -->
        @if (!facade.hasAvailableSlots()) {
          <div class="flex items-center gap-2 rounded-lg border border-amber-200 bg-amber-50 p-3 text-xs text-amber-800 dark:border-amber-900/50 dark:bg-amber-950/30 dark:text-amber-300">
            <ng-icon name="lucideAlertTriangle" class="text-base shrink-0" />
            <span>No hay cupos disponibles para esta categoría en este momento.</span>
          </div>
        }

        <!-- Slot & Rate Selector Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <!-- Slot Selection -->
          <div>
            <label for="slot-select" class="block text-xs font-semibold uppercase tracking-wider text-neutral-600 dark:text-neutral-300 mb-1.5">
              Cupo / Espacio <span class="text-red-500">*</span>
            </label>
            <select
              id="slot-select"
              [value]="facade.selectedSlotId() || ''"
              (change)="onSlotChange($event)"
              class="w-full rounded-lg border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-xs font-medium text-neutral-800 dark:text-neutral-200 focus:border-primary-500 focus:outline-hidden"
            >
              @if (facade.availableSlots().length === 0) {
                <option value="" disabled>Sin cupos disponibles</option>
              }
              @for (slot of facade.availableSlots(); track slot.id) {
                <option [value]="slot.id">
                  {{ slot.zone ? slot.zone + ' - ' : '' }}{{ slot.prefix ? slot.prefix + '-' : '' }}{{ slot.slotNumber }}
                </option>
              }
            </select>
          </div>

          <!-- Rate Selection -->
          <div>
            <label for="rate-select" class="block text-xs font-semibold uppercase tracking-wider text-neutral-600 dark:text-neutral-300 mb-1.5">
              Tarifa <span class="text-red-500">*</span>
            </label>
            <select
              id="rate-select"
              [value]="facade.selectedRateId() || ''"
              (change)="onRateChange($event)"
              class="w-full rounded-lg border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-xs font-medium text-neutral-800 dark:text-neutral-200 focus:border-primary-500 focus:outline-hidden"
            >
              @if (facade.availableRates().length === 0) {
                <option value="" disabled>Sin tarifas configuradas</option>
              }
              @for (rate of facade.availableRates(); track rate.id) {
                <option [value]="rate.id">
                  {{ rate.name }} (${{ rate.pricePerUnit }}/{{ rate.timeUnit }})
                </option>
              }
            </select>
          </div>
        </div>

        <!-- Optional Email -->
        <div>
          <label for="email-input" class="block text-xs font-semibold uppercase tracking-wider text-neutral-600 dark:text-neutral-300 mb-1.5">
            Correo Electrónico <span class="text-neutral-400 font-normal normal-case">(Opcional para recibo digital)</span>
          </label>
          <input
            id="email-input"
            type="email"
            [value]="facade.email()"
            (input)="onEmailInput($event)"
            placeholder="cliente@ejemplo.com"
            class="w-full rounded-lg border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-xs text-neutral-800 dark:text-neutral-200 placeholder:text-neutral-400 focus:border-primary-500 focus:outline-hidden"
          />
        </div>

        <!-- Modal Actions -->
        <div class="pt-3 border-t border-neutral-100 dark:border-neutral-800 flex items-center justify-end gap-2">
          <button
            type="button"
            (click)="onClose()"
            class="rounded-xl border border-neutral-200 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-4 py-2.5 text-xs font-semibold text-neutral-700 dark:text-neutral-200 hover:bg-neutral-50 dark:hover:bg-neutral-750 transition-colors"
          >
            Cancelar
          </button>
          <button
            type="submit"
            [disabled]="!facade.isValid() || facade.isSubmitting()"
            class="inline-flex items-center justify-center gap-2 rounded-xl bg-primary-600 px-5 py-2.5 text-xs font-semibold text-white hover:bg-primary-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all shadow-xs"
          >
            @if (facade.isSubmitting()) {
              <ng-icon name="lucideLoader2" class="animate-spin text-sm" />
              <span>Registrando...</span>
            } @else {
              <ng-icon name="lucideLogIn" class="text-sm" />
              <span>Emitir Ticket</span>
            }
          </button>
        </div>
      </form>
    </div>
  </div>
}

<!-- Ticket Receipt Modal -->
<app-ticket-receipt
  [isOpen]="facade.isReceiptOpen()"
  [ticket]="facade.lastIssuedTicket()"
  title="Ticket de Ingreso"
  subtitle="Vehículo registrado correctamente"
  (closed)="facade.closeReceipt()"
/>
