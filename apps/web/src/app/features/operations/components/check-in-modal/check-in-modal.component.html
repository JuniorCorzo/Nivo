@if (isOpen()) {
  <div
    class="animate-in fade-in fixed inset-0 z-50 flex items-end justify-center bg-black/60 p-0 backdrop-blur-xs duration-200 sm:items-center sm:p-4"
  >
    <div
      class="border-border bg-card text-card-foreground relative max-h-[90vh] w-full max-w-lg overflow-y-auto rounded-t-2xl border p-5 shadow-2xl transition-all sm:rounded-2xl sm:p-6"
    >
      <!-- Header -->
      <div
        class="border-border flex items-center justify-between border-b pb-4"
      >
        <div class="flex items-center gap-3">
          <div
            class="bg-primary/10 text-primary border-primary/20 flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border"
          >
            <ng-icon name="lucideLogIn" class="text-xl" />
          </div>
          <div>
            <h2 class="text-foreground text-base font-bold sm:text-lg">
              Registrar Ingreso de Vehículo
            </h2>
            <p class="text-muted-foreground text-xs">
              Asignar cupo y emitir ticket de parqueo
            </p>
          </div>
        </div>
        <button
          type="button"
          (click)="onClose()"
          class="text-muted-foreground hover:bg-accent hover:text-accent-foreground cursor-pointer rounded-lg p-1.5 transition-colors"
        >
          <ng-icon name="lucideX" class="text-lg" />
        </button>
      </div>

      <!-- Error Alert -->
      @if (facade.errorMessage()) {
        <div
          class="border-destructive/20 bg-destructive/10 text-destructive mt-4 flex items-start gap-2.5 rounded-lg border p-3 text-xs"
        >
          <ng-icon name="lucideAlertCircle" class="mt-0.5 shrink-0 text-base" />
          <span>{{ facade.errorMessage() }}</span>
        </div>
      }

      <!-- Form Body -->
      <form class="mt-4 space-y-4" (submit)="onSubmit($event)">
        <!-- Vehicle Type Selector -->
        <div>
          <label
            class="text-muted-foreground mb-1.5 block text-xs font-semibold tracking-wider uppercase"
          >
            Tipo de Vehículo
          </label>
          <div class="grid grid-cols-3 gap-1.5 sm:gap-2">
            <button
              type="button"
              (click)="facade.setVehicleType('CAR')"
              [class.border-primary]="facade.vehicleType() === 'CAR'"
              [class.bg-primary/10]="facade.vehicleType() === 'CAR'"
              [class.text-primary]="facade.vehicleType() === 'CAR'"
              class="border-border text-foreground hover:bg-accent hover:text-accent-foreground flex cursor-pointer flex-col items-center justify-center gap-1 rounded-xl border p-2.5 text-xs font-medium transition-colors sm:p-3"
            >
              <ng-icon name="lucideCar" class="text-lg" />
              <span>Automóvil</span>
            </button>

            <button
              type="button"
              (click)="facade.setVehicleType('MOTORCYCLE')"
              [class.border-primary]="facade.vehicleType() === 'MOTORCYCLE'"
              [class.bg-primary/10]="facade.vehicleType() === 'MOTORCYCLE'"
              [class.text-primary]="facade.vehicleType() === 'MOTORCYCLE'"
              class="border-border text-foreground hover:bg-accent hover:text-accent-foreground flex cursor-pointer flex-col items-center justify-center gap-1 rounded-xl border p-2.5 text-xs font-medium transition-colors sm:p-3"
            >
              <ng-icon name="lucideBike" class="text-lg" />
              <span>Motocicleta</span>
            </button>

            <button
              type="button"
              (click)="facade.setVehicleType('BIKE')"
              [class.border-primary]="facade.vehicleType() === 'BIKE'"
              [class.bg-primary/10]="facade.vehicleType() === 'BIKE'"
              [class.text-primary]="facade.vehicleType() === 'BIKE'"
              class="border-border text-foreground hover:bg-accent hover:text-accent-foreground flex cursor-pointer flex-col items-center justify-center gap-1 rounded-xl border p-2.5 text-xs font-medium transition-colors sm:p-3"
            >
              <ng-icon name="lucideBike" class="text-lg" />
              <span>Bicicleta</span>
            </button>
          </div>
        </div>

        <!-- License Plate Input -->
        <div>
          <label
            for="plate-input"
            class="text-muted-foreground mb-1.5 block text-xs font-semibold tracking-wider uppercase"
          >
            Placa / Matrícula <span class="text-destructive">*</span>
          </label>
          <div class="relative">
            <input
              id="plate-input"
              #plateInput
              type="text"
              [value]="facade.plate()"
              (input)="onPlateInput($event)"
              (keydown.enter)="onEnterKey($event)"
              placeholder="Ej: ABC123"
              maxlength="10"
              autocomplete="off"
              class="border-input bg-background text-foreground placeholder:text-muted-foreground focus:border-ring w-full rounded-xl border px-4 py-3 font-mono text-base font-bold tracking-widest uppercase transition-all placeholder:font-normal placeholder:tracking-normal focus:outline-hidden sm:text-lg"
            />
            <div
              class="text-muted-foreground absolute top-1/2 right-3 hidden -translate-y-1/2 font-mono text-xs sm:block"
            >
              ↵ Enter
            </div>
          </div>
        </div>

        <!-- Capacity Warning if full -->
        @if (!facade.hasAvailableSlots()) {
          <div
            class="border-warning/20 bg-warning/10 text-warning flex items-center gap-2 rounded-lg border p-3 text-xs"
          >
            <ng-icon name="lucideAlertTriangle" class="shrink-0 text-base" />
            <span
              >No hay cupos disponibles para esta categoría en este
              momento.</span
            >
          </div>
        }

        <!-- Slot & Rate Selector Grid -->
        <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
          <!-- Slot Selection -->
          <div>
            <label
              for="slot-select"
              class="text-muted-foreground mb-1.5 block text-xs font-semibold tracking-wider uppercase"
            >
              Cupo / Espacio <span class="text-destructive">*</span>
            </label>
            <select
              id="slot-select"
              [value]="facade.selectedSlotId() || ''"
              (change)="onSlotChange($event)"
              class="border-input bg-background text-foreground focus:border-ring w-full cursor-pointer rounded-lg border px-3 py-2 text-xs font-medium focus:outline-hidden"
            >
              @if (facade.availableSlots().length === 0) {
                <option value="" disabled>Sin cupos disponibles</option>
              }
              @for (slot of facade.availableSlots(); track slot.id) {
                <option [value]="slot.id">
                  {{ slot.zone ? slot.zone + " - " : ""
                  }}{{ slot.prefix ? slot.prefix + "-" : ""
                  }}{{ slot.slotNumber }}
                </option>
              }
            </select>
          </div>

          <!-- Rate Selection -->
          <div>
            <label
              for="rate-select"
              class="text-muted-foreground mb-1.5 block text-xs font-semibold tracking-wider uppercase"
            >
              Tarifa <span class="text-destructive">*</span>
            </label>
            <select
              id="rate-select"
              [value]="facade.selectedRateId() || ''"
              (change)="onRateChange($event)"
              class="border-input bg-background text-foreground focus:border-ring w-full cursor-pointer rounded-lg border px-3 py-2 text-xs font-medium focus:outline-hidden"
            >
              @if (facade.availableRates().length === 0) {
                <option value="" disabled>Sin tarifas configuradas</option>
              }
              @for (rate of facade.availableRates(); track rate.id) {
                <option [value]="rate.id">
                  {{ rate.name }} (${{ rate.pricePerUnit }}/{{ rate.timeUnit }})
                </option>
              }
            </select>
          </div>
        </div>

        <!-- Optional Email -->
        <div>
          <label
            for="email-input"
            class="text-muted-foreground mb-1.5 block text-xs font-semibold tracking-wider uppercase"
          >
            Correo Electrónico
            <span class="text-muted-foreground font-normal normal-case"
              >(Opcional para recibo digital)</span
            >
          </label>
          <input
            id="email-input"
            type="email"
            [value]="facade.email()"
            (input)="onEmailInput($event)"
            placeholder="cliente@ejemplo.com"
            class="border-input bg-background text-foreground placeholder:text-muted-foreground focus:border-ring w-full rounded-lg border px-3 py-2 text-xs focus:outline-hidden"
          />
        </div>

        <!-- Modal Actions -->
        <div
          class="border-border flex flex-col-reverse items-stretch justify-end gap-2 border-t pt-3 sm:flex-row sm:items-center"
        >
          <button
            type="button"
            (click)="onClose()"
            class="border-border bg-card text-foreground hover:bg-accent hover:text-accent-foreground w-full cursor-pointer rounded-xl border px-4 py-2.5 text-center text-xs font-semibold transition-colors sm:w-auto"
          >
            Cancelar
          </button>
          <button
            type="submit"
            [disabled]="!facade.isValid() || facade.isSubmitting()"
            class="bg-primary text-primary-foreground hover:bg-primary/90 inline-flex w-full cursor-pointer items-center justify-center gap-2 rounded-xl px-5 py-2.5 text-xs font-semibold shadow-xs transition-all disabled:cursor-not-allowed disabled:opacity-50 sm:w-auto"
          >
            @if (facade.isSubmitting()) {
              <ng-icon name="lucideLoader2" class="animate-spin text-sm" />
              <span>Registrando...</span>
            } @else {
              <ng-icon name="lucideLogIn" class="text-sm" />
              <span>Emitir Ticket</span>
            }
          </button>
        </div>
      </form>
    </div>
  </div>
}

<!-- Ticket Receipt Modal -->
<app-ticket-receipt
  [isOpen]="facade.isReceiptOpen()"
  [ticket]="facade.lastIssuedTicket()"
  title="Ticket de Ingreso"
  subtitle="Vehículo registrado correctamente"
  (closed)="facade.closeReceipt()"
/>
