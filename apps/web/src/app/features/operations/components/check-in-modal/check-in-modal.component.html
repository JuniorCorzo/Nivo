@if (isOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-xs p-4 animate-in fade-in duration-200">
    <div
      class="relative w-full max-w-lg rounded-2xl border border-border bg-card text-card-foreground p-6 shadow-2xl transition-all"
    >
      <!-- Header -->
      <div class="flex items-center justify-between pb-4 border-b border-border">
        <div class="flex items-center gap-3">
          <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-primary/10 text-primary border border-primary/20">
            <ng-icon name="lucideLogIn" class="text-xl" />
          </div>
          <div>
            <h2 class="text-lg font-bold text-foreground">Registrar Ingreso de Vehículo</h2>
            <p class="text-xs text-muted-foreground">Asignar cupo y emitir ticket de parqueo</p>
          </div>
        </div>
        <button
          type="button"
          (click)="onClose()"
          class="rounded-lg p-1.5 text-muted-foreground hover:bg-accent hover:text-accent-foreground cursor-pointer transition-colors"
        >
          <ng-icon name="lucideX" class="text-lg" />
        </button>
      </div>

      <!-- Error Alert -->
      @if (facade.errorMessage()) {
        <div class="mt-4 flex items-start gap-2.5 rounded-lg border border-destructive/20 bg-destructive/10 p-3 text-xs text-destructive">
          <ng-icon name="lucideAlertCircle" class="text-base shrink-0 mt-0.5" />
          <span>{{ facade.errorMessage() }}</span>
        </div>
      }

      <!-- Form Body -->
      <form class="mt-4 space-y-4" (submit)="onSubmit($event)">
        <!-- Vehicle Type Selector -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-muted-foreground mb-1.5">
            Tipo de Vehículo
          </label>
          <div class="grid grid-cols-3 gap-2">
            <button
              type="button"
              (click)="facade.setVehicleType('CAR')"
              [class.border-primary]="facade.vehicleType() === 'CAR'"
              [class.bg-primary/10]="facade.vehicleType() === 'CAR'"
              [class.text-primary]="facade.vehicleType() === 'CAR'"
              class="flex flex-col items-center justify-center p-3 rounded-xl border border-border text-foreground hover:bg-accent hover:text-accent-foreground transition-colors font-medium text-xs gap-1 cursor-pointer"
            >
              <ng-icon name="lucideCar" class="text-lg" />
              <span>Automóvil</span>
            </button>

            <button
              type="button"
              (click)="facade.setVehicleType('MOTORCYCLE')"
              [class.border-primary]="facade.vehicleType() === 'MOTORCYCLE'"
              [class.bg-primary/10]="facade.vehicleType() === 'MOTORCYCLE'"
              [class.text-primary]="facade.vehicleType() === 'MOTORCYCLE'"
              class="flex flex-col items-center justify-center p-3 rounded-xl border border-border text-foreground hover:bg-accent hover:text-accent-foreground transition-colors font-medium text-xs gap-1 cursor-pointer"
            >
              <ng-icon name="lucideBike" class="text-lg" />
              <span>Motocicleta</span>
            </button>

            <button
              type="button"
              (click)="facade.setVehicleType('BIKE')"
              [class.border-primary]="facade.vehicleType() === 'BIKE'"
              [class.bg-primary/10]="facade.vehicleType() === 'BIKE'"
              [class.text-primary]="facade.vehicleType() === 'BIKE'"
              class="flex flex-col items-center justify-center p-3 rounded-xl border border-border text-foreground hover:bg-accent hover:text-accent-foreground transition-colors font-medium text-xs gap-1 cursor-pointer"
            >
              <ng-icon name="lucideBike" class="text-lg" />
              <span>Bicicleta</span>
            </button>
          </div>
        </div>

        <!-- License Plate Input -->
        <div>
          <label for="plate-input" class="block text-xs font-semibold uppercase tracking-wider text-muted-foreground mb-1.5">
            Placa / Matrícula <span class="text-destructive">*</span>
          </label>
          <div class="relative">
            <input
              id="plate-input"
              #plateInput
              type="text"
              [value]="facade.plate()"
              (input)="onPlateInput($event)"
              (keydown.enter)="onEnterKey($event)"
              placeholder="Ej: ABC123"
              maxlength="10"
              autocomplete="off"
              class="w-full rounded-xl border border-input bg-background px-4 py-3 text-lg font-bold font-mono uppercase tracking-widest text-foreground placeholder:text-muted-foreground placeholder:font-normal placeholder:tracking-normal focus:border-ring focus:outline-hidden transition-all"
            />
            <div class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-mono text-muted-foreground">
              ↵ Enter
            </div>
          </div>
        </div>

        <!-- Capacity Warning if full -->
        @if (!facade.hasAvailableSlots()) {
          <div class="flex items-center gap-2 rounded-lg border border-warning/20 bg-warning/10 p-3 text-xs text-warning">
            <ng-icon name="lucideAlertTriangle" class="text-base shrink-0" />
            <span>No hay cupos disponibles para esta categoría en este momento.</span>
          </div>
        }

        <!-- Slot & Rate Selector Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <!-- Slot Selection -->
          <div>
            <label for="slot-select" class="block text-xs font-semibold uppercase tracking-wider text-muted-foreground mb-1.5">
              Cupo / Espacio <span class="text-destructive">*</span>
            </label>
            <select
              id="slot-select"
              [value]="facade.selectedSlotId() || ''"
              (change)="onSlotChange($event)"
              class="w-full rounded-lg border border-input bg-background px-3 py-2 text-xs font-medium text-foreground focus:border-ring focus:outline-hidden cursor-pointer"
            >
              @if (facade.availableSlots().length === 0) {
                <option value="" disabled>Sin cupos disponibles</option>
              }
              @for (slot of facade.availableSlots(); track slot.id) {
                <option [value]="slot.id">
                  {{ slot.zone ? slot.zone + ' - ' : '' }}{{ slot.prefix ? slot.prefix + '-' : '' }}{{ slot.slotNumber }}
                </option>
              }
            </select>
          </div>

          <!-- Rate Selection -->
          <div>
            <label for="rate-select" class="block text-xs font-semibold uppercase tracking-wider text-muted-foreground mb-1.5">
              Tarifa <span class="text-destructive">*</span>
            </label>
            <select
              id="rate-select"
              [value]="facade.selectedRateId() || ''"
              (change)="onRateChange($event)"
              class="w-full rounded-lg border border-input bg-background px-3 py-2 text-xs font-medium text-foreground focus:border-ring focus:outline-hidden cursor-pointer"
            >
              @if (facade.availableRates().length === 0) {
                <option value="" disabled>Sin tarifas configuradas</option>
              }
              @for (rate of facade.availableRates(); track rate.id) {
                <option [value]="rate.id">
                  {{ rate.name }} (${{ rate.pricePerUnit }}/{{ rate.timeUnit }})
                </option>
              }
            </select>
          </div>
        </div>

        <!-- Optional Email -->
        <div>
          <label for="email-input" class="block text-xs font-semibold uppercase tracking-wider text-muted-foreground mb-1.5">
            Correo Electrónico <span class="text-muted-foreground font-normal normal-case">(Opcional para recibo digital)</span>
          </label>
          <input
            id="email-input"
            type="email"
            [value]="facade.email()"
            (input)="onEmailInput($event)"
            placeholder="cliente@ejemplo.com"
            class="w-full rounded-lg border border-input bg-background px-3 py-2 text-xs text-foreground placeholder:text-muted-foreground focus:border-ring focus:outline-hidden"
          />
        </div>

        <!-- Modal Actions -->
        <div class="pt-3 border-t border-border flex items-center justify-end gap-2">
          <button
            type="button"
            (click)="onClose()"
            class="rounded-xl border border-border bg-card text-foreground hover:bg-accent hover:text-accent-foreground px-4 py-2.5 text-xs font-semibold cursor-pointer transition-colors"
          >
            Cancelar
          </button>
          <button
            type="submit"
            [disabled]="!facade.isValid() || facade.isSubmitting()"
            class="inline-flex items-center justify-center gap-2 rounded-xl bg-primary text-primary-foreground hover:bg-primary/90 px-5 py-2.5 text-xs font-semibold disabled:opacity-50 disabled:cursor-not-allowed transition-all shadow-xs cursor-pointer"
          >
            @if (facade.isSubmitting()) {
              <ng-icon name="lucideLoader2" class="animate-spin text-sm" />
              <span>Registrando...</span>
            } @else {
              <ng-icon name="lucideLogIn" class="text-sm" />
              <span>Emitir Ticket</span>
            }
          </button>
        </div>
      </form>
    </div>
  </div>
}

<!-- Ticket Receipt Modal -->
<app-ticket-receipt
  [isOpen]="facade.isReceiptOpen()"
  [ticket]="facade.lastIssuedTicket()"
  title="Ticket de Ingreso"
  subtitle="Vehículo registrado correctamente"
  (closed)="facade.closeReceipt()"
/>
