<div
  class="bg-card text-card-foreground border-border overflow-hidden rounded-2xl border shadow-xs"
>
  <div
    class="border-border flex flex-col justify-between gap-3 border-b p-3.5 sm:flex-row sm:items-center sm:p-5"
  >
    <div class="flex items-center gap-2">
      <h2 class="text-foreground text-sm font-bold sm:text-base">
        {{ texts.title }}
      </h2>
      <nv-badge variant="secondary" class="font-mono text-xs tabular-nums"
        >{{ filteredActiveTickets().length }}</nv-badge
      >
    </div>

    <div class="flex w-full items-center gap-2 sm:w-auto">
      <div class="relative w-full sm:w-64">
        <label for="search-ticket-mobile" class="sr-only"
          >{{ texts.searchSrLabel }}</label
        >
        <nv-input
          [id]="'search-ticket-mobile'"
          name="searchTicketMobile"
          startIcon="lucideSearch"
          [placeholder]="texts.searchPlaceholder"
          [ngModel]="searchTicketQuery()"
          (ngModelChange)="onSearchChange($event)"
          (keydown.enter)="onSubmitCheckOut()"
        />
        @if (searchTicketQuery()) {
        <nv-button
          type="button"
          size="icon"
          variant="ghost"
          (click)="onClearSearch()"
          [attr.aria-label]="texts.clearSearch"
          class="text-muted-foreground hover:text-foreground absolute top-1/2 right-1.5 h-7 w-7 -translate-y-1/2"
        >
          <span class="sr-only">{{ texts.clearSearch }}</span>
          <ng-icon name="lucideX" size="14" />
        </nv-button>
        }
      </div>
      <nv-button
        type="button"
        size="sm"
        variant="secondary"
        (click)="onSubmitCheckOut()"
        class="shrink-0 text-nowrap"
      >
        <ng-icon name="lucideLogOut" size="14" class="mr-1" />
        <span>{{ texts.directCollectAction }}</span>
      </nv-button>
      <nv-button
        type="button"
        size="sm"
        variant="outline"
        (click)="onScanQr()"
        class="shrink-0 text-nowrap"
        [title]="texts.scanQrTitle"
        [attr.aria-label]="texts.scanQrTitle"
      >
        <ng-icon name="lucideQrCode" class="text-primary mr-1 text-sm" />
        <span>{{ texts.scanQrAction }}</span>
        <kbd [class]="kbdClass">{{ texts.hotkeyQ }}</kbd>
      </nv-button>
    </div>
  </div>

  <app-data-table [table]="table" [emptyMessage]="texts.emptyTitle">
    <div
      emptyState
      class="text-muted-foreground flex flex-col items-center justify-center py-12 text-center text-xs"
    >
      <ng-icon
        name="lucideTicket"
        size="32"
        class="text-muted-foreground/60 mb-2"
      />
      <p class="font-medium">{{ texts.emptyTitle }}</p>
      <span class="text-muted-foreground/80 text-[11px]"
        >{{ texts.emptySubtitle }}</span
      >
    </div>
  </app-data-table>
</div>
