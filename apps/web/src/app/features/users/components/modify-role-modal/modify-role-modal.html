<nv-modal
  [isOpen]="isOpen()"
  role="dialog"
  [titleId]="titleId"
  [descriptionId]="descriptionId"
  (closed)="onCancel()"
>
  @if (user(); as targetUser) {
    <!-- Header -->
    <div
      class="border-border flex items-center justify-between border-b pb-3.5"
    >
      <div class="flex items-center gap-2.5">
        <div
          class="bg-primary/10 text-primary grid h-9 w-9 place-items-center rounded-lg"
        >
          <ng-icon name="lucideShieldCheck" size="18" />
        </div>
        <div>
          <nv-h3 [id]="titleId" class="text-foreground text-base font-bold">
            {{ texts.title }}
          </nv-h3>
          <span [id]="descriptionId" class="text-muted-foreground text-xs">
            {{ texts.subtitle }}
          </span>
        </div>
      </div>
      <button
        type="button"
        class="border-border bg-card text-muted-foreground hover:bg-accent hover:text-accent-foreground inline-grid h-8 w-8 cursor-pointer place-items-center rounded-lg border transition-colors"
        (click)="onCancel()"
        [attr.aria-label]="texts.actions.cancel"
      >
        <ng-icon name="lucideX" size="16" />
      </button>
    </div>

    <!-- User summary card -->
    <div
      class="border-border bg-muted/40 mt-4 flex items-center justify-between rounded-xl border p-3.5"
    >
      <div>
        <div class="text-muted-foreground text-xs">{{ texts.userLabel }}</div>
        <div class="text-foreground text-sm font-semibold">
          {{ targetUser.fullName }}
        </div>
        <div class="text-muted-foreground text-xs">{{ targetUser.email }}</div>
      </div>
      <div class="flex flex-col items-end gap-1">
        <span class="text-muted-foreground text-xs"
          >{{ texts.currentRoleLabel }}</span
        >
        <app-user-role-badge [role]="targetUser.role" />
      </div>
    </div>

    <!-- Owner protection notice -->
    @if (isOwner()) {
      <div
        class="mt-4 flex items-start gap-2.5 rounded-xl border border-amber-500/20 bg-amber-500/10 p-3 text-xs text-amber-700 dark:text-amber-400"
        role="alert"
      >
        <ng-icon name="lucideAlertTriangle" size="16" class="mt-0.5 shrink-0" />
        <span>{{ texts.ownerRoleNotice }}</span>
      </div>
    }

    <!-- Role Selector -->
    <div class="mt-4 flex flex-col gap-3.5">
      <nv-select
        [label]="texts.form.role.label"
        [placeholder]="texts.form.role.placeholder"
        [items]="roleOptions"
        [displayFn]="displayRole"
        [valueFn]="roleValue"
        [value]="selectedRole()"
        [disabled]="isOwner()"
        (valueChange)="onRoleChange($event)"
      />
    </div>

    <!-- Actions -->
    <div
      class="border-border mt-5 flex justify-end gap-2.5 border-t pt-3.5"
    >
      <nv-button type="button" variant="outline" (click)="onCancel()">
        {{ texts.actions.cancel }}
      </nv-button>
      <nv-button
        type="button"
        [disabled]="isSubmitting() || isOwner()"
        (click)="onSubmit()"
      >
        {{ texts.actions.submit }}
      </nv-button>
    </div>
  }
</nv-modal>
