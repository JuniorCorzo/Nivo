@if (isOpen()) {
  <div
    class="animate-in fade-in fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4 backdrop-blur-xs duration-200"
    role="dialog"
    aria-modal="true"
    aria-labelledby="invite-user-title"
    aria-describedby="invite-user-description"
    (click)="onBackdropClick($event)"
  >
    <div
      class="relative w-full max-w-md rounded-2xl border border-border bg-card p-5 text-card-foreground shadow-2xl transition-all"
      (click)="$event.stopPropagation()"
    >
      <!-- Header -->
      <div
        class="flex items-center justify-between border-b border-border pb-3.5"
      >
        <div class="flex items-center gap-2.5">
          <div
            class="grid h-9 w-9 place-items-center rounded-lg bg-primary/10 text-primary"
          >
            <ng-icon name="lucideUserPlus" size="18" />
          </div>
          <div>
            <nv-h3 id="invite-user-title" class="text-base font-bold text-foreground">
              {{ texts.title }}
            </nv-h3>
            <span id="invite-user-description" class="text-xs text-muted-foreground">
              {{ texts.subtitle }}
            </span>
          </div>
        </div>
        <button
          type="button"
          class="inline-grid h-8 w-8 cursor-pointer place-items-center rounded-lg border border-border bg-card text-muted-foreground transition-colors hover:bg-accent hover:text-accent-foreground"
          (click)="onCancel()"
          aria-label="Cerrar"
        >
          <ng-icon name="lucideX" size="16" />
        </button>
      </div>

      <!-- Form -->
      <form
        [formGroup]="form"
        (ngSubmit)="onSubmit()"
        class="mt-4 flex flex-col gap-3.5"
      >
        <nv-input
          [label]="texts.form.fullName.label"
          [placeholder]="texts.form.fullName.placeholder"
          formControlName="fullName"
          startIcon="lucideUser"
        />

        <nv-input
          [label]="texts.form.email.label"
          [placeholder]="texts.form.email.placeholder"
          type="email"
          formControlName="email"
          startIcon="lucideMail"
        />

        <nv-input
          [label]="texts.form.contactInfo.label"
          [placeholder]="texts.form.contactInfo.placeholder"
          formControlName="contactInfo"
          startIcon="lucidePhone"
        />

        <nv-select
          [label]="texts.form.role.label"
          [placeholder]="texts.form.role.placeholder"
          [items]="roleOptions"
          [displayFn]="displayRole"
          [valueFn]="roleValue"
          [value]="form.controls.role.value"
          (valueChange)="onRoleChange($event)"
        />

        <!-- Actions -->
        <div class="mt-5 flex justify-end gap-2.5 border-t border-border pt-3.5">
          <nv-button
            type="button"
            variant="outline"
            (click)="onCancel()"
          >
            {{ texts.actions.cancel }}
          </nv-button>
          <nv-button
            type="submit"
            [disabled]="isSubmitting()"
          >
            {{ texts.actions.submit }}
          </nv-button>
        </div>
      </form>
    </div>
  </div>
}
