<div class="mx-auto flex w-full max-w-7xl flex-col gap-6 p-4 sm:p-6 lg:p-8">
  <!-- Page Header -->
  <app-page-header
    [title]="texts.titles.page"
    [subtitle]="texts.titles.subtitle"
    icon="lucideUsers"
  >
    <div actions>
      <nv-button
        type="button"
        (click)="facade.openInviteModal()"
      >
        <ng-icon name="lucideUserPlus" size="16" />
        {{ texts.actions.invite }}
      </nv-button>
    </div>
  </app-page-header>

  <!-- KPI Grid -->
  <app-users-kpi-grid
    [total]="facade.totalUsers()"
    [activeOperators]="facade.activeOperators()"
    [managers]="facade.managers()"
    [deactivated]="facade.deactivatedUsers()"
  />

  <!-- Filters -->
  <app-users-filters
    [searchQuery]="facade.searchQuery()"
    [selectedRole]="facade.roleFilter()"
    [roleFilters]="roleFilters"
    (searchChange)="facade.setSearchQuery($event)"
    (roleChange)="facade.setRoleFilter($event)"
  />

  <!-- Users Table -->
  <app-users-table
    [table]="facade.table"
    [isLoading]="facade.isLoading()"
    (changeRole)="facade.openModifyRoleModal($event)"
    (deactivate)="facade.openDeactivateModal($event)"
    (resetFilters)="facade.resetFilters()"
  />

  <!-- Modals -->
  <app-invite-user-modal
    [isOpen]="facade.isInviteModalOpen()"
    (closed)="facade.closeInviteModal()"
    (invited)="facade.loadUsers()"
  />

  <app-modify-role-modal
    [isOpen]="facade.isModifyRoleModalOpen()"
    [user]="facade.selectedUserForRole()"
    (closed)="facade.closeModifyRoleModal()"
    (updated)="facade.loadUsers()"
  />

  <app-deactivate-user-modal
    [isOpen]="facade.isDeactivateModalOpen()"
    [user]="facade.selectedUserForDeactivation()"
    (closed)="facade.closeDeactivateModal()"
    (deactivated)="facade.loadUsers()"
  />
</div>
