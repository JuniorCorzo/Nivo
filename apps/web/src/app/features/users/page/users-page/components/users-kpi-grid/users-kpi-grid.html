<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
  <!-- Total Users -->
  <nv-card>
    <nv-card-content class="flex items-center gap-4 p-5">
      <div
        class="bg-primary/10 text-primary flex h-12 w-12 items-center justify-center rounded-xl"
      >
        <ng-icon name="lucideUsers" size="24" />
      </div>
      <div>
        <nv-muted class="text-xs font-semibold tracking-wider uppercase">
          {{ texts.totalUsers }}
        </nv-muted>
        <div class="font-mono text-2xl font-bold tabular-nums">
          {{ total() }}
        </div>
      </div>
    </nv-card-content>
  </nv-card>

  <!-- Active Operators -->
  <nv-card>
    <nv-card-content class="flex items-center gap-4 p-5">
      <div
        class="bg-success/10 text-success flex h-12 w-12 items-center justify-center rounded-xl"
      >
        <ng-icon name="lucideShieldCheck" size="24" />
      </div>
      <div>
        <nv-muted class="text-xs font-semibold tracking-wider uppercase">
          {{ texts.activeOperators }}
        </nv-muted>
        <div class="font-mono text-2xl font-bold tabular-nums">
          {{ activeOperators() }}
        </div>
      </div>
    </nv-card-content>
  </nv-card>

  <!-- Managers -->
  <nv-card>
    <nv-card-content class="flex items-center gap-4 p-5">
      <div
        class="bg-info/10 text-info flex h-12 w-12 items-center justify-center rounded-xl"
      >
        <ng-icon name="lucideShield" size="24" />
      </div>
      <div>
        <nv-muted class="text-xs font-semibold tracking-wider uppercase">
          {{ texts.managers }}
        </nv-muted>
        <div class="font-mono text-2xl font-bold tabular-nums">
          {{ managers() }}
        </div>
      </div>
    </nv-card-content>
  </nv-card>

  <!-- Deactivated Users -->
  <nv-card>
    <nv-card-content class="flex items-center gap-4 p-5">
      <div
        class="bg-muted text-muted-foreground flex h-12 w-12 items-center justify-center rounded-xl"
      >
        <ng-icon name="lucideUserX" size="24" />
      </div>
      <div>
        <nv-muted class="text-xs font-semibold tracking-wider uppercase">
          {{ texts.deactivated }}
        </nv-muted>
        <div class="font-mono text-2xl font-bold tabular-nums">
          {{ deactivated() }}
        </div>
      </div>
    </nv-card-content>
  </nv-card>
</div>
