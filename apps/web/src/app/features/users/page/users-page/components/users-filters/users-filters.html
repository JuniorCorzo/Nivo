<nv-card>
  <nv-card-content class="flex flex-col gap-4 p-5 sm:flex-row sm:items-center sm:justify-between">
    <div class="w-full sm:max-w-md">
      <nv-input
        [placeholder]="texts.searchPlaceholder"
        [value]="searchQuery()"
        startIcon="lucideSearch"
        (input)="onSearchInput($event)"
      />
    </div>

    <div class="flex flex-wrap items-center gap-1.5">
      @for (filter of roleFilters(); track filter.value) {
        <nv-button
          type="button"
          size="sm"
          [variant]="selectedRole() === filter.value ? 'default' : 'outline'"
          (click)="onRoleClick(filter.value)"
        >
          {{ filter.label }}
        </nv-button>
      }
    </div>
  </nv-card-content>
</nv-card>
