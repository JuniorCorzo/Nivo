<div class="mx-auto flex w-full max-w-7xl flex-col gap-6 p-4 sm:p-6 lg:p-8">
  <!-- Back Link & Title Header -->
  <app-page-header
    [title]="headerContext().title"
    [subtitle]="headerContext().subtitle"
    icon="lucideTicket"
  ></app-page-header>

  <!-- Stats Grid -->
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
    <nv-card
      role="button"
      tabindex="0"
      class="hover:border-primary/40 focus-visible:ring-primary cursor-pointer transition-all duration-200 hover:shadow-xs focus-visible:ring-2 focus-visible:outline-none"
      [class.border-primary]="facade.filters().status === 'ALL'"
      [class.ring-1]="facade.filters().status === 'ALL'"
      [class.ring-primary]="facade.filters().status === 'ALL'"
      [attr.aria-pressed]="facade.filters().status === 'ALL'"
      (click)="facade.updateFilters({ status: 'ALL' })"
      (keydown.enter)="facade.updateFilters({ status: 'ALL' })"
      (keydown.space)="$event.preventDefault(); facade.updateFilters({ status: 'ALL' })"
    >
      <nv-card-content class="flex items-center gap-4 p-5">
        <div
          class="bg-primary/10 text-primary flex h-12 w-12 items-center justify-center rounded-xl"
        >
          <ng-icon name="lucideTicket" size="24" />
        </div>
        <div>
          <nv-muted class="text-xs font-semibold tracking-wider uppercase"
            >{{ texts.stats.total }}</nv-muted
          >
          <div class="font-mono text-2xl font-bold tabular-nums">
            {{ facade.ticketStats().total }}
          </div>
        </div>
      </nv-card-content>
    </nv-card>

    <nv-card
      role="button"
      tabindex="0"
      class="hover:border-primary/40 cursor-pointer transition-all duration-200 hover:shadow-xs focus-visible:ring-2 focus-visible:ring-emerald-500 focus-visible:outline-none"
      [class.border-emerald-500]="facade.filters().status === 'OPEN'"
      [class.ring-1]="facade.filters().status === 'OPEN'"
      [class.ring-emerald-500]="facade.filters().status === 'OPEN'"
      [attr.aria-pressed]="facade.filters().status === 'OPEN'"
      (click)="facade.updateFilters({ status: 'OPEN' })"
      (keydown.enter)="facade.updateFilters({ status: 'OPEN' })"
      (keydown.space)="$event.preventDefault(); facade.updateFilters({ status: 'OPEN' })"
    >
      <nv-card-content class="flex items-center gap-4 p-5">
        <div
          class="bg-success/10 text-success flex h-12 w-12 items-center justify-center rounded-xl"
        >
          <ng-icon name="lucideClock" size="24" />
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <nv-muted class="text-xs font-semibold tracking-wider uppercase"
              >{{ texts.stats.open }}</nv-muted
            >
            <span
              class="inline-block h-2 w-2 animate-pulse rounded-full bg-emerald-500"
            ></span>
          </div>
          <div class="font-mono text-2xl font-bold tabular-nums">
            {{ facade.ticketStats().open }}
          </div>
        </div>
      </nv-card-content>
    </nv-card>

    <nv-card
      role="button"
      tabindex="0"
      class="hover:border-primary/40 focus-visible:ring-primary cursor-pointer transition-all duration-200 hover:shadow-xs focus-visible:ring-2 focus-visible:outline-none"
      [class.border-primary]="facade.filters().status === 'CLOSED'"
      [class.ring-1]="facade.filters().status === 'CLOSED'"
      [class.ring-primary]="facade.filters().status === 'CLOSED'"
      [attr.aria-pressed]="facade.filters().status === 'CLOSED'"
      (click)="facade.updateFilters({ status: 'CLOSED' })"
      (keydown.enter)="facade.updateFilters({ status: 'CLOSED' })"
      (keydown.space)="$event.preventDefault(); facade.updateFilters({ status: 'CLOSED' })"
    >
      <nv-card-content class="flex items-center gap-4 p-5">
        <div
          class="bg-muted text-muted-foreground flex h-12 w-12 items-center justify-center rounded-xl"
        >
          <ng-icon name="lucideCheckCircle2" size="24" />
        </div>
        <div>
          <nv-muted class="text-xs font-semibold tracking-wider uppercase"
            >{{ texts.stats.closed }}</nv-muted
          >
          <div class="font-mono text-2xl font-bold tabular-nums">
            {{ facade.ticketStats().closed }}
          </div>
        </div>
      </nv-card-content>
    </nv-card>
  </div>

  <!-- Filters -->
  <nv-card>
    <nv-card-content class="p-5">
      <app-ticket-filters
        [filters]="facade.filters()"
        [showParkingLotFilter]="facade.isTenantView()"
        [parkingLots]="facade.parkingLots()"
        (filtersChange)="facade.updateFilters($event)"
        (reset)="facade.resetFilters()"
      />
    </nv-card-content>
  </nv-card>

  <!-- Tickets Table -->
  <app-tickets-table
    [table]="facade.table"
    [isLoading]="facade.isLoading()"
    (selectTicket)="facade.openDetail($event)"
    (reprintReceipt)="facade.openReceipt($event)"
    (resetFilters)="facade.resetFilters()"
  />

  <!-- Detail Drawer -->
  <app-ticket-detail-drawer
    [isOpen]="facade.isDrawerOpen()"
    [ticket]="facade.selectedTicket()"
    [liveRate]="facade.liveRatePreview()"
    [isLoadingRate]="facade.isCalculatingRate()"
    (close)="facade.closeDetail()"
    (reprintReceipt)="facade.openReceipt($event)"
  />

  <!-- Ticket Receipt Modal -->
  <app-ticket-receipt
    [isOpen]="facade.isReceiptOpen()"
    [ticket]="facade.selectedTicket()"
    [title]="texts.receiptModal.title"
    [subtitle]="texts.receiptModal.subtitle"
    (closed)="facade.closeReceipt()"
  />
</div>
