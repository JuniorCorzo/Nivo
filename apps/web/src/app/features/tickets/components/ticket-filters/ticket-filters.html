<div class="flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
  <div
    class="grid grid-cols-1 gap-3"
    [class.sm:grid-cols-3]="!showParkingLotFilter()"
    [class.md:w-3/4]="!showParkingLotFilter()"
    [class.sm:grid-cols-2]="showParkingLotFilter()"
    [class.lg:grid-cols-4]="showParkingLotFilter()"
    [class.md:flex-1]="showParkingLotFilter()"
  >
    <!-- License Plate Search -->
    <div class="w-full">
      <nv-input
        id="ticket-search-plate"
        [label]="texts.plate.label"
        [placeholder]="texts.plate.placeholder"
        startIcon="lucideSearch"
        [value]="filters().plate"
        (input)="onPlateInput($event)"
      />
    </div>

    <!-- Parking Lot Selector -->
    @if (showParkingLotFilter()) {
      <div class="w-full">
        <nv-select
          id="ticket-filter-parking-lot"
          [label]="texts.parkingLot.label"
          [placeholder]="texts.parkingLot.placeholder"
          [items]="parkingLotOptions()"
          [displayFn]="displayOptionFn"
          [valueFn]="valueOptionFn"
          [value]="filters().parkingLotId"
          (valueChange)="onParkingLotChange($event)"
        />
      </div>
    }

    <!-- Status Selector -->
    <div class="w-full">
      <nv-select
        id="ticket-filter-status"
        [label]="texts.status.label"
        [placeholder]="texts.status.placeholder"
        [items]="statusOptions"
        [displayFn]="displayOptionFn"
        [valueFn]="valueOptionFn"
        [value]="filters().status"
        (valueChange)="onStatusChange($event)"
      />
    </div>

    <!-- Vehicle Type Selector -->
    <div class="w-full">
      <nv-select
        id="ticket-filter-vehicle"
        [label]="texts.vehicle.label"
        [placeholder]="texts.vehicle.placeholder"
        [items]="vehicleOptions"
        [displayFn]="displayOptionFn"
        [valueFn]="valueOptionFn"
        [value]="filters().vehicleType"
        (valueChange)="onVehicleChange($event)"
      />
    </div>
  </div>

  <!-- Reset Button -->
  <div class="flex items-center">
    <nv-button
      type="button"
      variant="outline"
      size="md"
      class="w-full md:w-auto"
      (click)="onReset()"
    >
      <ng-icon name="lucideRotateCcw" size="16" />
      {{ texts.reset }}
    </nv-button>
  </div>
</div>
