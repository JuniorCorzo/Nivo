<div class="flex flex-col gap-4">
  <app-page-header
    [title]="texts.title"
    [subtitle]="texts.subtitle"
    [breadcrumbs]="breadcrumbs()"
  >
    <!-- Action Controls -->
    <div
      actions
      class="flex w-full flex-wrap items-center justify-between gap-2 sm:w-auto sm:justify-end"
    >
      <!-- Time Granularity Selector -->
      <div
        data-testid="time-granularity-filter"
        class="border-border bg-card no-scrollbar flex max-w-full items-center overflow-x-auto rounded-lg border p-1 shadow-xs"
      >
        <button
          nv-button
          class="shrink-0"
          [variant]="timeGranularity() === 'today' ? 'default' : 'ghost'"
          size="sm"
          (click)="granularityChange.emit('today')"
          data-testid="granularity-today"
        >
          {{ texts.granularity.today }}
        </button>
        <button
          nv-button
          class="shrink-0"
          [variant]="timeGranularity() === '7days' ? 'default' : 'ghost'"
          size="sm"
          (click)="granularityChange.emit('7days')"
          data-testid="granularity-week"
        >
          {{ texts.granularity.sevenDays }}
        </button>
        <button
          nv-button
          class="shrink-0"
          [variant]="timeGranularity() === '30days' ? 'default' : 'ghost'"
          size="sm"
          (click)="granularityChange.emit('30days')"
          data-testid="granularity-month"
        >
          {{ texts.granularity.thirtyDays }}
        </button>
      </div>

      <!-- Telemetry Refresh -->
      <button
        nv-button
        variant="outline"
        size="sm"
        (click)="refreshTelemetry.emit()"
      >
        <ng-icon name="lucideRefreshCw" class="mr-1.5" />
        {{ texts.actions.sync }}
      </button>
    </div>
  </app-page-header>

  @if (isMultiParkingTenant()) {
  <div
    data-testid="multi-parking-selector"
    class="border-border bg-card no-scrollbar flex items-center gap-2 overflow-x-auto rounded-xl border p-2 shadow-xs sm:flex-wrap"
  >
    <span
      class="text-muted-foreground mr-1 flex shrink-0 items-center gap-1.5 pl-1 text-xs font-semibold tracking-wider uppercase"
    >
      <ng-icon
        name="lucideBuilding2"
        class="text-muted-foreground h-3.5 w-3.5"
      />
      {{ texts.scope.label }}
    </span>
    <button
      nv-button
      class="shrink-0"
      [variant]="
        activeScope().mode === 'GLOBAL' ? 'default' : 'outline'
      "
      size="sm"
      (click)="scopeChange.emit({ mode: 'GLOBAL' })"
    >
      <ng-icon name="lucideBuilding2" class="mr-1.5" />
      {{ texts.scope.allParkings }}
    </button>
    @for (parking of accessibleParkings(); track parking.id) {
    <button
      nv-button
      class="shrink-0"
      [variant]="
        activeScope().mode === 'SINGLE' &&
        activeScope().parkingId === parking.id
          ? 'default'
          : 'outline'
      "
      size="sm"
      (click)="scopeChange.emit({ mode: 'SINGLE', parkingId: parking.id })"
    >
      <ng-icon name="lucideCar" class="mr-1.5" />
      {{ parking.name }}
    </button>
    }
  </div>
  }
</div>
