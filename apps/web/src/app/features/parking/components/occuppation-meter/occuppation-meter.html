<div class="flex w-full flex-col gap-1.5">
  @if (showDetails()) {
  <div class="flex items-center justify-between gap-2 text-xs">
    <span class="text-foreground font-medium">
      <span class="font-mono font-semibold">{{ occupied() }}</span>
      <span class="text-muted-foreground"> / </span>
      <span class="font-mono font-semibold">{{ totalCapacity() ?? 0 }}</span>
      <span class="text-muted-foreground ml-1 text-[11px]">ocupados</span>
    </span>
    <span class="text-foreground font-mono text-xs font-semibold">
      {{ ratio() }}%
    </span>
  </div>
  }
  <div
    #occuppation_meter
    class="bg-muted relative h-1.5 w-full overflow-hidden rounded-full after:absolute after:h-1.5 after:w-(--bar-width) after:rounded-full after:bg-(--bar-background) after:transition-all after:duration-300"
    role="meter"
    [attr.aria-valuenow]="value()"
    [attr.aria-valuemin]="min()"
    [attr.aria-valuemax]="max()"
  ></div>
</div>
