<div class="flex flex-col gap-1.5 w-full">
  @if (showDetails()) {
    <div class="flex items-center justify-between text-xs gap-2">
      <span class="font-medium text-foreground">
        <span class="font-mono font-semibold">{{ occupied() }}</span>
        <span class="text-muted-foreground"> / </span>
        <span class="font-mono font-semibold">{{ totalCapacity() ?? 0 }}</span>
        <span class="text-muted-foreground text-[11px] ml-1">ocupados</span>
      </span>
      <span class="font-mono text-xs font-semibold text-foreground">
        {{ ratio() }}%
      </span>
    </div>
  }
  <div
    #occuppation_meter
    class="relative w-full h-1.5 bg-muted rounded-full overflow-hidden after:w-(--bar-width) after:h-1.5 after:absolute after:bg-(--bar-background) after:rounded-full after:transition-all after:duration-300"
    role="meter"
    [attr.aria-valuenow]="value()"
    [attr.aria-valuemin]="min()"
    [attr.aria-valuemax]="max()"
  ></div>
</div>
