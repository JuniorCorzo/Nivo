<div class="grid grid-cols-2 gap-3 sm:grid-cols-2 sm:gap-4 lg:grid-cols-4">
  <!-- Total Capacity & Plazas Ocupadas -->
  <nv-card
    class="flex h-full min-h-[110px] flex-col justify-between rounded-xl shadow-xs"
  >
    <div class="p-4">
      <div class="flex items-center justify-between gap-1">
        <nv-muted
          class="block truncate text-[11px] font-semibold tracking-wider uppercase"
        >
          Plazas Ocupadas
        </nv-muted>
        <div
          class="bg-primary/10 text-primary border-primary/20 flex h-7 w-7 shrink-0 items-center justify-center rounded-lg border sm:h-8 sm:w-8"
        >
          <ng-icon name="lucideParkingSquare" size="18" class="shrink-0" />
        </div>
      </div>
      <div class="mt-2 flex flex-col">
        <div class="flex items-baseline gap-2">
          <nv-mono class="text-foreground font-mono text-2xl font-bold">
            {{ occupiedSlots() }} / {{ totalSlots() }}
          </nv-mono>
        </div>
        <nv-muted class="mt-0.5 block truncate font-mono text-[11px]">
          {{ availableSlots() }} disponibles
        </nv-muted>
      </div>
    </div>
  </nv-card>

  <!-- Occupancy Rate -->
  <nv-card
    class="flex h-full min-h-[110px] flex-col justify-between rounded-xl shadow-xs"
  >
    <div class="p-4">
      <div class="flex items-center justify-between gap-1">
        <nv-muted
          class="block truncate text-[11px] font-semibold tracking-wider uppercase"
        >
          Ocupación
        </nv-muted>
        <div
          class="bg-info/10 text-info border-info/20 flex h-7 w-7 shrink-0 items-center justify-center rounded-lg border sm:h-8 sm:w-8"
        >
          <ng-icon name="lucideCar" size="18" class="shrink-0" />
        </div>
      </div>
      <div class="mt-2 flex flex-col">
        <div class="flex items-baseline justify-between gap-2">
          <nv-mono class="text-foreground font-mono text-2xl font-bold">
            {{ occupationRate() }}%
          </nv-mono>
          <nv-muted class="xs:inline hidden text-[11px]">en vivo</nv-muted>
        </div>
        <!-- Progress Bar Indicator -->
        <div class="bg-muted mt-1.5 h-1.5 w-full overflow-hidden rounded-full">
          <div
            class="h-full rounded-full transition-all duration-300"
            [class.bg-emerald-500]="occupationRate() < 70"
            [class.bg-amber-500]="occupationRate() >= 70 && occupationRate() < 90"
            [class.bg-rose-500]="occupationRate() >= 90"
            [style.width.%]="occupationRate()"
          ></div>
        </div>
      </div>
    </div>
  </nv-card>

  <!-- Currency & Billing -->
  <nv-card
    class="flex h-full min-h-12 flex-col justify-between rounded-xl shadow-xs"
  >
    <div class="p-4">
      <div class="flex items-center justify-between gap-1">
        <nv-muted
          class="block truncate text-[11px] font-semibold tracking-wider uppercase"
        >
          Moneda Base
        </nv-muted>
        <div
          class="bg-primary/10 text-primary border-primary/20 flex h-7 w-7 shrink-0 items-center justify-center rounded-lg border sm:h-8 sm:w-8"
        >
          <ng-icon name="lucideCoins" size="18" class="shrink-0" />
        </div>
      </div>
      <div class="mt-2 flex flex-col">
        <div class="flex items-baseline gap-2">
          <nv-mono class="text-foreground font-mono text-2xl font-bold">
            {{ currency() }}
          </nv-mono>
        </div>
        <nv-muted class="mt-0.5 block truncate text-[11px]">
          facturación
        </nv-muted>
      </div>
    </div>
  </nv-card>

  <!-- Coordenadas -->
  <nv-card
    class="flex h-full min-h-[110px] flex-col justify-between rounded-xl shadow-xs"
  >
    <div class="p-4">
      <div class="flex items-center justify-between gap-1">
        <nv-muted
          class="block truncate text-[11px] font-semibold tracking-wider uppercase"
        >
          Coordenadas
        </nv-muted>
        <div
          class="bg-warning/10 text-warning border-warning/20 flex h-7 w-7 shrink-0 items-center justify-center rounded-lg border sm:h-8 sm:w-8"
        >
          <ng-icon name="lucideMapPin" size="18" class="shrink-0" />
        </div>
      </div>
      <div class="mt-2 flex flex-col">
        <div class="flex items-baseline gap-2">
          <nv-mono
            class="text-foreground block truncate font-mono text-xs font-bold sm:text-sm"
          >
            {{ formattedCoords() }}
          </nv-mono>
        </div>
        <nv-muted class="mt-0.5 block truncate text-[11px]"> GPS </nv-muted>
      </div>
    </div>
  </nv-card>
</div>
