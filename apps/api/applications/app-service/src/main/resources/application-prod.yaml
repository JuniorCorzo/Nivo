# ============================================================
# Nivo API - Production Profile Configuration
# ============================================================
spring:
  flyway:
    enabled: true
    schemas: nivo
    default-schema: nivo
    locations: classpath:db/migration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        globally_quoted_identifiers: true
        default_schema: nivo
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: "${RSA_PUBLIC_KEY_LOCATION:classpath:keys/public.pem}"
          issuer-uri: "${jwt.issue}"
  threads:
    virtual:
      enabled: true
  task:
    execution:
      thread-name-prefix: virtual-async-

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true

cors:
  allowed-origins: "${CORS_ALLOWED_ORIGINS}"

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:false}
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

scalar:
  enabled: ${SCALAR_ENABLED:false}
  url: /api/v3/api-docs
  path: /scalar
  theme: moon
  layout: modern
  show-sidebar: true
  dark-mode: true

# ── RSA Key Pair (for JWT signing) ─────────────────────────
rsa:
  public-key: "${RSA_PUBLIC_KEY_LOCATION:classpath:keys/public.pem}"
  private-key: "${RSA_PRIVATE_KEY_LOCATION:classpath:keys/private.pem}"
  key-id: "${RSA_KEY_ID:nivo-prod-key}"

# ── JWT Settings ────────────────────────────────────────────
jwt:
  issue: "${JWT_ISSUE}"
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800}

# ── SendGrid (Email Notifications) ─────────────────────────
sendgrid:
  api-key: "${SENDGRID_API_KEY}"
  from-email: "${SENDGRID_FROM_EMAIL:noreply@nivo.dev}"

security:
  aes:
    secret-key: "${AES_SECRET_KEY}"

# ── Payment Provider ────────────────────────────────────────
payment:
  provider:
    provider-name: "${PAYMENT_PROVIDER_NAME:epayco}"
    url: "${PAYMENT_PROVIDER_URL:https://apify.epayco.co}"
    public-key: "${PAYMENT_PUBLIC_KEY}"
    private-key: "${PAYMENT_PRIVATE_KEY}"
    expiration-time: ${PAYMENT_EXPIRATION_TIME:25}
    confirmation-url: "${PAYMENT_CONFIRMATION_URL}"
    confirmation-method: "${PAYMENT_CONFIRMATION_METHOD:POST}"

# ── App Business Properties ─────────────────────────────────
app:
  currency: "${APP_CURRENCY:COP}"
  cta-url: "${APP_CTA_URL}"
  company-name: "${APP_COMPANY_NAME:Nivo}"
  support-url: "${APP_SUPPORT_URL}"
  social-url: "${APP_SOCIAL_URL}"
  unsubscribe-url: "${APP_UNSUBSCRIBE_URL}"
  address-company: "${APP_ADDRESS_COMPANY}"

logging:
  level:
    root: INFO
    dev.angelcorzo.nivo: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
    org.flywaydb: INFO
    com.zaxxer.hikari: INFO
