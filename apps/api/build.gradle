plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'dev.angelcorzo.nivo'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
    options.incremental = true
    options.fork = true
    options.forkOptions.jvmArgs = [
        '-XX:+TieredCompilation',
        '-XX:TieredStopAtLevel=1'
    ]
}

repositories {
    mavenCentral()
    maven { url = "https://repo.spring.io/snapshot" }
    maven { url = "https://repo.spring.io/milestone" }
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'

    // Spring Framework & Security
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework:spring-tx'
    implementation 'org.springframework.security:spring-security-core'
    implementation 'org.springframework.security:spring-security-crypto'

    // Database & Flyway
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.hibernate.orm:hibernate-spatial'
    runtimeOnly 'org.postgresql:postgresql'

    // Observability & API Documentation
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:2.8.13'
    implementation 'com.scalar.maven:scalar-webmvc:0.6.63'

    // Notifications & Communications
    implementation 'com.sendgrid:sendgrid-java:4.10.3'
    implementation 'org.slf4j:slf4j-api'

    // Security & Tokens
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.82'

    // Jackson
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Reactive Commons Object Mapper
    implementation 'org.reactivecommons.utils:object-mapper-api:0.1.0'

    // MapStruct & Lombok
    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    implementation 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Devtools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework:spring-web'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
    testImplementation 'org.reactivecommons.utils:object-mapper:0.1.0'
    testImplementation 'tools.jackson.core:jackson-databind'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
    testCompileOnly 'org.projectlombok:lombok:1.18.38'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.38'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.register('explodedJar', Copy) {
    with jar
    into layout.buildDirectory.dir("exploded")
}

jar {
    enabled = false
}

bootJar {
    archiveFileName = 'Nivo.jar'
}

bootRun {
    jvmArgs = [
        '-XX:+TieredCompilation',
        '-XX:TieredStopAtLevel=1',
        '-Dspring.output.ansi.enabled=ALWAYS'
    ]
    systemProperty 'spring.profiles.active', findProperty('profile') ?: System.getProperty('spring.profiles.active', 'dev')
}

test {
    useJUnitPlatform()
    maxParallelForks = (Runtime.runtime.availableProcessors() / 2).toInteger() ?: 1
    forkEvery = 100
    jvmArgs = [
        '-Xmx2g',
        '-XX:+TieredCompilation',
        '-XX:TieredStopAtLevel=1'
    ]
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = '0.8.13'
    reportsDirectory = layout.buildDirectory.dir("reports")
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file("reports/jacoco.xml")
        csv.required = false
        html.required = true
        html.outputLocation = layout.buildDirectory.dir("reports/jacocoHtml")
    }
}