server:
  port: ${API_PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: "Nivo"
  devtools:
    add-properties: false
  datasource:
    driverClassName: org.postgresql.Driver
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nivo_db}?currentSchema=nivo&sslmode=${DB_SSL_MODE:require}&channelBinding=${DB_CHANNEL_BINDING:require}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:60000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:600000}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:30000}
      keepalive-time: ${DB_POOL_KEEPALIVE_TIME:0}
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    schemas: ${SPRING_FLYWAY_SCHEMAS:nivo,public}
    default-schema: ${SPRING_FLYWAY_DEFAULT_SCHEMA:nivo}
    locations: ${SPRING_FLYWAY_LOCATIONS:classpath:db/migration}
    out-of-order: ${SPRING_FLYWAY_OUT_OF_ORDER:true}
    validate-on-migrate: ${SPRING_FLYWAY_VALIDATE_ON_MIGRATE:true}
    clean-disabled: ${SPRING_FLYWAY_CLEAN_DISABLED:true}
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    connect-retries: ${SPRING_FLYWAY_CONNECT_RETRIES:10}
    connect-retries-interval: ${SPRING_FLYWAY_CONNECT_RETRIES_INTERVAL:5}
    lock-retry-count: ${SPRING_FLYWAY_LOCK_RETRY_COUNT:50}
  jpa:
    databasePlatform: org.hibernate.dialect.PostgreSQLDialect
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        globally_quoted_identifiers: true
        default_schema: ${JPA_DEFAULT_SCHEMA:nivo}
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: "${RSA_PUBLIC_KEY_LOCATION:classpath:keys/public.pem}"
          issuer-uri: "${jwt.issue}"
  threads:
    virtual:
      enabled: true
  cache:
    type: ${SPRING_CACHE_TYPE:redis}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2000ms}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:16}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}
          max-wait: ${REDIS_POOL_MAX_WAIT:1000ms}
  task:
    execution:
      thread-name-prefix: virtual-async-

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true

cors:
  allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080,http://localhost:63342}"

rsa:
  public-key: "${RSA_PUBLIC_KEY_LOCATION:classpath:keys/public.pem}"
  private-key: "${RSA_PRIVATE_KEY_LOCATION:classpath:keys/private.pem}"
  key-id: "${RSA_KEY_ID:nivo-prod-key}"

security:
  aes:
    secret-key: "${AES_SECRET_KEY}"
  cookie:
    secure: ${COOKIE_SECURE:false}

jwt:
  issue: "${JWT_ISSUE:https://api.nivo.dev}"
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800}

nivo:
  cache:
    default-ttl: ${CACHE_DEFAULT_TTL:10m}
    ttls:
      slot-summary: ${CACHE_TTL_SLOT_SUMMARY:2h}
      rates: ${CACHE_TTL_RATES:24h}
      parking-lots: ${CACHE_TTL_PARKING_LOTS:24h}
      parking-lots-list: ${CACHE_TTL_PARKING_LOTS_LIST:24h}
      special-policies: ${CACHE_TTL_SPECIAL_POLICIES:168h}
      public-availability: ${CACHE_TTL_PUBLIC_AVAILABILITY:60s}
  notification:
    email:
      provider: "${NIVO_EMAIL_PROVIDER:BREVO}"
      brevo:
        api-key: "${BREVO_API_KEY:xkeysib-dev-key}"
        url: "${BREVO_API_URL:https://api.brevo.com/v3}"
        sender-name: "${BREVO_SENDER_NAME:Nivo}"
        sender-email: "${BREVO_SENDER_EMAIL:noreply@nivo.dev}"
        connect-timeout: ${BREVO_CONNECT_TIMEOUT_MS:5000}
        read-timeout: ${BREVO_READ_TIMEOUT_MS:10000}

payment:
  enabled: ${PAYMENT_ENABLED:false}

app:
  currency: "${APP_CURRENCY:COP}"
  cta-url: "${APP_CTA_URL:https://nivo.dev/cta}"
  company-name: "${APP_COMPANY_NAME:Nivo}"
  support-url: "${APP_SUPPORT_URL:https://nivo.dev/support}"
  social-url: "${APP_SOCIAL_URL:https://nivo.dev/social}"
  unsubscribe-url: "${APP_UNSUBSCRIBE_URL:https://nivo.dev/unsubscribe}"
  address-company: "${APP_ADDRESS_COMPANY:123 Main St, City, Country}"
  account-creation-enabled: ${ACCOUNT_CREATION_ENABLED:false}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    dev.angelcorzo.nivo: ${LOG_LEVEL_APP:INFO}
    org.springframework.web: ${LOG_LEVEL_SPRING_WEB:WARN}
    org.springframework.security: ${LOG_LEVEL_SPRING_SECURITY:WARN}
    org.hibernate: ${LOG_LEVEL_HIBERNATE:WARN}
    org.flywaydb: ${LOG_LEVEL_FLYWAY:INFO}
    com.zaxxer.hikari: ${LOG_LEVEL_HIKARI:INFO}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

scalar:
  enabled: ${SCALAR_ENABLED:true}
  url: /api/v3/api-docs
  path: /scalar
  theme: moon
  layout: modern
  show-sidebar: true
  dark-mode: true

sentry:
  dsn: "${SENTRY_DSN:}"
  traces-sample-rate: "${SENTRY_TRACES_SAMPLE_RATE:0.2}"
  send-default-pii: ${SENTRY_SEND_DEFAULT_PII:true}
  environment: "${SENTRY_ENVIRONMENT:${SPRING_PROFILES_ACTIVE:production}}"
