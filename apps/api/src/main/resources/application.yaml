server:
  port: ${API_PORT:8080}
  servlet:
    context-path: /api
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: "Nivo"
  devtools:
    add-properties: false
  datasource:
    driverClassName: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nivo_db}?currentSchema=nivo&sslmode=${DB_SSL_MODE:require}&channelBinding=${DB_CHANNEL_BINDING:require}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    schemas: nivo
    default-schema: nivo
    locations: classpath:db/migration
  jpa:
    databasePlatform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        globally_quoted_identifiers: true
        default_schema: nivo
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: "${RSA_PUBLIC_KEY_LOCATION:classpath:keys/public.pem}"
          issuer-uri: "${jwt.issue}"
  threads:
    virtual:
      enabled: true
  task:
    execution:
      thread-name-prefix: virtual-async-
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080,http://localhost:63342}"

rsa:
  public-key: "${RSA_PUBLIC_KEY_LOCATION:classpath:keys/public.pem}"
  private-key: "${RSA_PRIVATE_KEY_LOCATION:classpath:keys/private.pem}"
  key-id: "${RSA_KEY_ID:nivo-prod-key}"

security:
  aes:
    secret-key: "${AES_SECRET_KEY}"

jwt:
  issue: "${JWT_ISSUE:https://api.nivo.dev}"
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800}

sendgrid:
  api-key: "${SENDGRID_API_KEY:SG.dev_mock}"
  from-email: "${SENDGRID_FROM_EMAIL:noreply@nivo.dev}"

payment:
  provider:
    provider-name: "${PAYMENT_PROVIDER_NAME:epayco}"
    url: "${PAYMENT_PROVIDER_URL:https://apify.epayco.co}"
    public-key: "${PAYMENT_PUBLIC_KEY:dev_pub_key}"
    private-key: "${PAYMENT_PRIVATE_KEY:dev_priv_key}"
    expiration-time: ${PAYMENT_EXPIRATION_TIME:25}
    confirmation-url: "${PAYMENT_CONFIRMATION_URL:http://localhost:8080/api/payments/confirm}"
    confirmation-method: "${PAYMENT_CONFIRMATION_METHOD:POST}"

app:
  currency: "${APP_CURRENCY:COP}"
  cta-url: "${APP_CTA_URL:https://nivo.dev/cta}"
  company-name: "${APP_COMPANY_NAME:Nivo}"
  support-url: "${APP_SUPPORT_URL:https://nivo.dev/support}"
  social-url: "${APP_SOCIAL_URL:https://nivo.dev/social}"
  unsubscribe-url: "${APP_UNSUBSCRIBE_URL:https://nivo.dev/unsubscribe}"
  address-company: "${APP_ADDRESS_COMPANY:123 Main St, City, Country}"

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

scalar:
  enabled: ${SCALAR_ENABLED:true}
  url: /api/v3/api-docs
  path: /scalar
  theme: moon
  layout: modern
  show-sidebar: true
  dark-mode: true

sentry:
  dsn: "${SENTRY_DSN:}"
  traces-sample-rate: "${SENTRY_TRACES_SAMPLE_RATE:0.2}"
  send-default-pii: ${SENTRY_SEND_DEFAULT_PII:true}
  environment: "${SPRING_PROFILES_ACTIVE:production}"
