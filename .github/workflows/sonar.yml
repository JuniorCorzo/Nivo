name: SonarCloud Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "gradle"

      - name: Set up Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: 1.3.13

      - name: Grant execute permission for gradlew
        run: chmod +x apps/api/gradlew

      - name: Generate development RSA keys for tests
        run: |
          mkdir -p apps/api/src/main/resources/keys
          openssl genrsa -out apps/api/src/main/resources/keys/private.pem 2048
          openssl rsa -in apps/api/src/main/resources/keys/private.pem -pubout -out apps/api/src/main/resources/keys/public.pem

      - name: Pre-pull PostgreSQL Testcontainers image
        run: docker pull postgis/postgis:16-3.4

      - name: Run Backend Tests with JaCoCo
        run: ./apps/api/gradlew -p apps/api test jacocoTestReport --no-daemon

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run Web Tests with Coverage
        run: bun run --cwd apps/web test:coverage

      - name: Run SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9 # v7.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
