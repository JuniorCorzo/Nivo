name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  test-backend:
    name: Backend Tests (API)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 25
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x apps/api/gradlew

      - name: Generate development RSA keys for tests
        run: |
          mkdir -p apps/api/src/main/resources/keys
          openssl genrsa -out apps/api/src/main/resources/keys/private.pem 2048
          openssl rsa -in apps/api/src/main/resources/keys/private.pem -pubout -out apps/api/src/main/resources/keys/public.pem

      - name: Pre-pull PostgreSQL Testcontainers image
        run: docker pull postgis/postgis:16-3.4

      - name: Validate Database Migrations (Pre-Flight)
        run: ./apps/api/gradlew -p apps/api validateMigrations --no-daemon

      - name: Run Backend Tests
        run: ./apps/api/gradlew -p apps/api test --no-daemon

      - name: Upload JaCoCo Report and Compiled Classes
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: backend-test-results
          path: |
            apps/api/build/reports/jacoco.xml
            apps/api/build/classes/java/main
          retention-days: 1

  test-frontend:
    name: Frontend Tests (Web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run Web Unit Tests with Coverage
        run: pnpm --filter web test:coverage

      - name: Upload Web Coverage
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: web-coverage
          path: apps/web/coverage/web/lcov.info
          retention-days: 1

  test-design-system:
    name: Design System Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run Design System Tests
        run: pnpm --filter @nivo-sass/design-system test

  test-e2e:
    name: Frontend E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: pnpm --filter web test:e2e:chromium
        env:
          E2E_BASE_URL: "http://127.0.0.1:4200"

      - name: Upload Playwright Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: playwright-artifacts
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7

  sonarcloud:
    name: SonarCloud Analysis
    needs: [test-backend, test-frontend, test-design-system, test-e2e]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Download backend test results
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: backend-test-results
          path: apps/api/build

      - name: Download web coverage
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: web-coverage
          path: apps/web/coverage/web

      - name: Verify coverage artifacts structure
        run: |
          echo "=== Checking SonarCloud input files ==="
          ls -ld apps/api/build/classes/java/main || true
          ls -l apps/api/build/reports/jacoco.xml || true
          ls -l apps/web/coverage/web/lcov.info || true

      - name: Run SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9 # v7.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
