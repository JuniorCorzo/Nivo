services:
  postgis-e2e:
    container_name: nivo_e2e_database
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=nivo_e2e_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nivo_e2e_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - nivo_e2e_postgres_data:/var/lib/postgresql/data
      - ./init.sh:/docker-entrypoint-initdb.d/init.sh:z
    networks:
      - nivo_e2e_net

  lightpanda:
    container_name: nivo_e2e_lightpanda
    image: lightpanda/browser:nightly
    restart: unless-stopped
    command: ["lightpanda", "--host", "0.0.0.0", "--port", "9222"]
    ports:
      - "9222:9222"
    networks:
      - nivo_e2e_net

volumes:
  nivo_e2e_postgres_data:

networks:
  nivo_e2e_net:
