x-common-service: &common-service
  restart: unless-stopped
  networks:
    - nivo_net

x-platform-env: &platform-env
  APP_VERSION: ${APP_VERSION:-1.0.0}
  DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
  DEPLOY_PLATFORM: docker_compose

x-traefik-web-labels: &traefik-web-labels
  - "traefik.enable=${TRAEFIK_ENABLED:-true}"
  - "traefik.http.routers.nivo-web.rule=Host(`${DOMAIN_NAME:-localhost}`)"
  - "traefik.http.routers.nivo-web.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
  - "traefik.http.routers.nivo-web.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
  - "traefik.http.services.nivo-web.loadbalancer.server.port=80"

x-database-env: &database-env
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:-nivo_db}

x-api-datasource-env: &api-datasource-env
  DB_URL: ${DB_URL:-jdbc:postgresql://database:5432/${POSTGRES_DB:-nivo_db}?currentSchema=nivo}
  DB_USERNAME: ${DB_USERNAME:-${POSTGRES_USER:-postgres}}
  DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD}}

x-api-security-env: &api-security-env
  JWT_ISSUE: ${JWT_ISSUE}
  AES_SECRET_KEY: ${AES_SECRET_KEY}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  RSA_PUBLIC_KEY_LOCATION: ${RSA_PUBLIC_KEY_LOCATION:-classpath:keys/public.pem}
  RSA_PRIVATE_KEY_LOCATION: ${RSA_PRIVATE_KEY_LOCATION:-classpath:keys/private.pem}
  RSA_KEY_ID: ${RSA_KEY_ID:-nivo-prod-key}

x-api-integrations-env: &api-integrations-env
  SENDGRID_API_KEY: ${SENDGRID_API_KEY}
  PAYMENT_PUBLIC_KEY: ${PAYMENT_PUBLIC_KEY}
  PAYMENT_PRIVATE_KEY: ${PAYMENT_PRIVATE_KEY}
  PAYMENT_CONFIRMATION_URL: ${PAYMENT_CONFIRMATION_URL}

x-api-runtime-env: &api-runtime-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
  SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
  SCALAR_ENABLED: ${SCALAR_ENABLED:-false}

x-resources-web: &resources-web
  resources:
    limits:
      cpus: '${WEB_CPU_LIMIT:-0.50}'
      memory: ${WEB_MEM_LIMIT:-256M}
    reservations:
      cpus: '${WEB_CPU_RESERVATION:-0.10}'
      memory: ${WEB_MEM_RESERVATION:-64M}

x-resources-api: &resources-api
  resources:
    limits:
      cpus: '${API_CPU_LIMIT:-2.0}'
      memory: ${API_MEM_LIMIT:-1024M}
    reservations:
      cpus: '${API_CPU_RESERVATION:-0.25}'
      memory: ${API_MEM_RESERVATION:-512M}

x-resources-db: &resources-db
  resources:
    limits:
      cpus: '${DB_CPU_LIMIT:-2.0}'
      memory: ${DB_MEM_LIMIT:-1024M}
    reservations:
      cpus: '${DB_CPU_RESERVATION:-0.25}'
      memory: ${DB_MEM_RESERVATION:-256M}

services:
  web:
    <<: *common-service
    image: ${WEB_IMAGE:-ghcr.io/juniorcorzo/nivo-web:latest}
    build:
      context: ..
      dockerfile: apps/web/deployment/Dockerfile
    environment:
      <<: *platform-env
    labels: *traefik-web-labels
    networks:
      - nivo_net
      - dokploy-network
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    deploy:
      <<: *resources-web

  api:
    <<: *common-service
    image: ${API_IMAGE:-ghcr.io/juniorcorzo/nivo-api:latest}
    build:
      context: ..
      dockerfile: apps/api/deployment/Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      <<: [*platform-env, *api-runtime-env, *api-datasource-env, *api-security-env, *api-integrations-env]
    ports:
      - "${API_PORT:-8080}:8080"
    deploy:
      <<: *resources-api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/api/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    volumes:
      - ${RSA_KEYS_DIR:-./keys}:/app/keys:ro

  database:
    <<: *common-service
    container_name: nivo_database
    image: postgis/postgis:16-3.4
    environment:
      <<: [*platform-env, *database-env]
    ports:
      - "${DB_PORT:-5432}:5432"
    deploy:
      <<: *resources-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nivo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sh:/docker-entrypoint-initdb.d/init.sh:z

volumes:
  postgres_data:

networks:
  nivo_net:
  dokploy-network:
    external: true
    name: ${DOKPLOY_NETWORK:-dokploy-network}
