x-common-service: &common-service
  restart: unless-stopped

x-platform-env: &platform-env
  APP_VERSION: ${APP_VERSION:-1.0.0}
  DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
  DEPLOY_PLATFORM: docker_compose

x-database-env: &database-env
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:-nivo_db}

x-api-datasource-env: &api-datasource-env
  DB_HOST: ${DB_HOST:-database}
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${POSTGRES_DB:-nivo_db}
  DB_SSL_MODE: ${DB_SSL_MODE:-require}
  DB_CHANNEL_BINDING: ${DB_CHANNEL_BINDING:-require}
  DB_USERNAME: ${DB_USERNAME:-${POSTGRES_USER:-postgres}}
  DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD}}

x-api-security-env: &api-security-env
  JWT_ISSUE: ${JWT_ISSUE}
  AES_SECRET_KEY: ${AES_SECRET_KEY}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  RSA_PUBLIC_KEY_LOCATION: ${RSA_PUBLIC_KEY_LOCATION:-classpath:keys/public.pem}
  RSA_PRIVATE_KEY_LOCATION: ${RSA_PRIVATE_KEY_LOCATION:-classpath:keys/private.pem}
  RSA_KEY_ID: ${RSA_KEY_ID:-nivo-prod-key}

x-api-integrations-env: &api-integrations-env
  SENDGRID_API_KEY: ${SENDGRID_API_KEY}
  PAYMENT_PUBLIC_KEY: ${PAYMENT_PUBLIC_KEY}
  PAYMENT_PRIVATE_KEY: ${PAYMENT_PRIVATE_KEY}
  PAYMENT_CONFIRMATION_URL: ${PAYMENT_CONFIRMATION_URL}

x-api-runtime-env: &api-runtime-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
  SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
  SCALAR_ENABLED: ${SCALAR_ENABLED:-false}

x-resources-web: &resources-web
  resources:
    limits:
      cpus: '${WEB_CPU_LIMIT:-0.50}'
      memory: ${WEB_MEM_LIMIT:-256M}
    reservations:
      cpus: '${WEB_CPU_RESERVATION:-0.10}'
      memory: ${WEB_MEM_RESERVATION:-64M}

x-resources-api: &resources-api
  resources:
    limits:
      cpus: '${API_CPU_LIMIT:-2.0}'
      memory: ${API_MEM_LIMIT:-1024M}
    reservations:
      cpus: '${API_CPU_RESERVATION:-0.25}'
      memory: ${API_MEM_RESERVATION:-512M}

x-resources-db: &resources-db
  resources:
    limits:
      cpus: '${DB_CPU_LIMIT:-2.0}'
      memory: ${DB_MEM_LIMIT:-1024M}
    reservations:
      cpus: '${DB_CPU_RESERVATION:-0.25}'
      memory: ${DB_MEM_RESERVATION:-256M}

x-resources-prometheus: &resources-prometheus
  resources:
    limits:
      cpus: '${PROMETHEUS_CPU_LIMIT:-1.0}'
      memory: ${PROMETHEUS_MEM_LIMIT:-512M}
    reservations:
      cpus: '${PROMETHEUS_CPU_RESERVATION:-0.10}'
      memory: ${PROMETHEUS_MEM_RESERVATION:-128M}

x-resources-grafana: &resources-grafana
  resources:
    limits:
      cpus: '${GRAFANA_CPU_LIMIT:-1.0}'
      memory: ${GRAFANA_MEM_LIMIT:-256M}
    reservations:
      cpus: '${GRAFANA_CPU_RESERVATION:-0.10}'
      memory: ${GRAFANA_MEM_RESERVATION:-64M}

services:
  web:
    <<: *common-service
    image: ${WEB_IMAGE:-ghcr.io/juniorcorzo/nivo-web:latest}
    pull_policy: always
    environment:
      <<: *platform-env
    networks:
      - nivo_net
      - dokploy-network
    depends_on:
      api:
        condition: service_healthy
    deploy:
      <<: *resources-web

  api:
    <<: *common-service
    image: ${API_IMAGE:-ghcr.io/juniorcorzo/nivo-api:latest}
    pull_policy: always
    networks:
      - nivo_net
    depends_on:
      database:
        condition: service_healthy
    environment:
      <<: [*platform-env, *api-runtime-env, *api-datasource-env, *api-security-env, *api-integrations-env]
    deploy:
      <<: *resources-api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/api/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    volumes:
      - ${RSA_KEYS_DIR:-./keys}:/app/keys:ro

  database:
    <<: *common-service
    container_name: nivo_database
    image: postgis/postgis:16-3.4
    networks:
      - nivo_net
    environment:
      <<: [*platform-env, *database-env]
    deploy:
      <<: *resources-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nivo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sh:/docker-entrypoint-initdb.d/init.sh:z

  prometheus:
    <<: *common-service
    container_name: nivo_prometheus
    image: prom/prometheus:v2.54.1
    networks:
      - nivo_net
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    deploy:
      <<: *resources-prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    <<: *common-service
    container_name: nivo_grafana
    image: grafana/grafana:11.2.0
    networks:
      - nivo_net
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    deploy:
      <<: *resources-grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  nivo_net:
  dokploy-network:
    external: true
    name: ${DOKPLOY_NETWORK:-dokploy-network}
